q:[["天気予報＿＿＿、一日中いい天気だった。",["に反して","に応じて","に沿って","に基づいて"],"てんきよほう に はんして、いちにちじゅう いい てんき だった。","Contrariando a previsão, fez tempo bom o dia todo.","Contrário ao previsto: に反して."],
   ["本人の意志＿＿＿、入院させられた。",["に反して","に対して","にとって","によって"],"ほんにんの いし に はんして、にゅういん させられた。","Contra a própria vontade, foi internado.","Contra a vontade: に反して."],
   ["法律＿＿＿行為は許されない。",["に反する","に反して","に対する","について"],"ほうりつ に はんする こういは ゆるされない。","Atos contra a lei não são permitidos.","Antes de substantivo: に反する."]]},

{id:"ja-nikakawarazu",u:"n2-8",t:"〜にかかわらず",m:"independentemente de",f:"S + にかかわらず; V dicionário + V ない + にかかわらず",
e:"Não importa qual seja a condição (tempo, idade, resultado), o resultado é o mesmo. Usado com pares: 好き嫌いにかかわらず.",
c:"を問わず é quase igual, mas mais usado com categorias (年齢・性別・経験を問わず).",
x:[["天候に|かかわらず、|試合は|行われます。","てんこうに かかわらず、しあいは おこなわれます。","Independentemente do tempo, o jogo será realizado."],
   ["参加する|しないに|かかわらず、|返事を|ください。","さんか する しないに かかわらず、へんじを ください。","Participando ou não, responda por favor."],
   ["結果に|かかわらず、|よく|頑張った。","けっかに かかわらず、よく がんばった。","Independentemente do resultado, você se esforçou muito."]],
q:[["金額の多少＿＿＿、寄付は大歓迎です。",["にかかわらず","に対して","にしては","にとって"],"きんがくの たしょう に かかわらず、きふは だいかんげい です。","Qualquer que seja o valor, doações são muito bem-vindas.","Não importa a quantidade: にかかわらず."],
   ["行く行かない＿＿＿、明日までに連絡してください。",["にかかわらず","につれて","に沿って","とともに"],"いく いかない に かかわらず、あしたまでに れんらく して ください。","Indo ou não, avise até amanhã.","Pares opostos + にかかわらず."],
   ["晴雨＿＿＿、イベントは開催します。",["にかかわらず","をめぐって","に先立って","に応じて"],"せいう に かかわらず、イベントは かいさい します。","Com chuva ou sol, o evento acontece.","晴雨にかかわらず é expressão fixa."]]},

{id:"ja-wotowazu",u:"n2-8",t:"〜を問わず",m:"sem distinção de; não importa (qual)",f:"S + を問(と)わず",
e:"Comum em anúncios de emprego e eventos: 年齢・性別を問わず = sem distinção de idade e sexo.",
c:"Costuma vir com categorias ou pares: 昼夜, 男女, 国内外.",
x:[["経験を|問わず、|誰でも|応募|できます。","けいけんを とわず、だれでも おうぼ できます。","Independente de experiência, qualquer um pode se candidatar."],
   ["この|店は|昼夜を|問わず|混んで|いる。","この みせは ちゅうやを とわず こんで いる。","Esta loja está cheia dia e noite."],
   ["男女を|問わず|人気の|ある|スポーツだ。","だんじょを とわず にんきの ある スポーツ だ。","É um esporte popular entre homens e mulheres."]],
q:[["このイベントには年齢＿＿＿参加できます。",["を問わず","に対して","をめぐって","にとって"],"この イベントには ねんれい を とわず さんか できます。","Neste evento pode participar qualquer idade.","Sem distinção: を問わず."],
   ["国の内外＿＿＿、多くのファンがいる。",["を問わず","に反して","に基づき","に先立ち"],"くにの ないがい を とわず、おおくの ファンが いる。","Dentro e fora do país, tem muitos fãs.","Categoria/par + を問わず."],
   ["この仕事は学歴＿＿＿、やる気のある人を募集しています。",["を問わず","にしては","によって","のわりに"],"この しごとは がくれき を とわず、やるきの ある ひとを ぼしゅう して います。","Esta vaga não exige formação; buscamos pessoas motivadas.","Anúncio de emprego: を問わず."]]},

/* ---------- n2-9 ---------- */
{id:"ja-kiri",u:"n2-9",t:"〜きり",m:"desde que... (e nunca mais); só",f:"V た + きり; S + きり",
e:"1) Depois daquela ação nada mais aconteceu: 出かけたきり帰ってこない. 2) Só/apenas: 二人きり.",
c:"たまま = ficar no mesmo estado; たきり = e nunca mais.",
x:[["彼とは|去年|会った|きり、|連絡して|いない。","かれとは きょねん あった きり、れんらく して いない。","Vi ele ano passado e desde então não tivemos contato."],
   ["息子は|朝|出かけた|きり、|まだ|帰って|こない。","むすこは あさ でかけた きり、まだ かえって こない。","Meu filho saiu de manhã e ainda não voltou."],
   ["二人|きりで|話したい。","ふたり きりで はなしたい。","Quero falar a sós."]],
q:[["祖父は去年入院した＿＿＿、まだ家に帰れない。",["きり","まま","ほど","うえ"],"そふは きょねん にゅういん した きり、まだ いえに かえれない。","Meu avô foi internado ano passado e ainda não voltou para casa.","Desde então nada mudou: たきり."],
   ["それ＿＿＿彼女から手紙は来なかった。",["きり","だけに","ほど","ばかりか"],"それ きり かのじょから てがみは こなかった。","Depois disso, nunca mais chegou carta dela.","それきり = desde aquilo."],
   ["部屋で一人＿＿＿になりたい。",["きり","ほど","しか","まで"],"へやで ひとり きりに なりたい。","Quero ficar sozinho no quarto.","Apenas: 一人きり."]]},

{id:"ja-ppanashi",u:"n2-9",t:"〜っぱなし",m:"deixar (fazendo/ligado); sem parar",f:"V ます-raiz + っぱなし",
e:"1) Deixar algo no estado sem resolver (negativo): 電気をつけっぱなし. 2) Uma ação contínua: 立ちっぱなし = em pé o tempo todo.",
c:"まま é neutro; っぱなし critica o descuido.",
x:[["電気を|つけっぱなしで|寝て|しまった。","でんきを つけっぱなしで ねて しまった。","Dormi com a luz acesa."],
   ["今日は|一日中|立ちっぱなし|だった。","きょうは いちにちじゅう たちっぱなし だった。","Hoje fiquei em pé o dia inteiro."],
   ["窓を|開けっぱなしに|しないで。","まどを あけっぱなしに しないで。","Não deixe a janela aberta."]],
q:[["水を出し＿＿＿にしないでください。",["っぱなし","きり","がち","っぽい"],"みずを だしっぱなしに しないで ください。","Não deixe a torneira aberta.","Deixar ligado (descuido): っぱなし."],
   ["この仕事は座り＿＿＿なので、腰が痛くなる。",["っぱなし","がち","ぎみ","つつ"],"この しごとは すわりっぱなし なので、こしが いたく なる。","Neste trabalho fico sentado o tempo todo, a lombar dói.","Ação contínua: っぱなし."],
   ["彼は物を使い＿＿＿で、片付けない。",["っぱなし","きり","ながら","かけ"],"かれは ものを つかいっぱなしで、かたづけない。","Ele usa as coisas e deixa jogado, não arruma.","っぱなしで + consequência."]]},

{id:"ja-nagaramo",u:"n2-9",t:"〜ながら(も)",m:"embora; apesar de",f:"V ます-raiz / adj い / adj な (sem な) / S + ながら(も)",
e:"Concessão: duas coisas que contrastam no mesmo sujeito. 残念ながら = infelizmente.",
c:"ながら (simultâneo) com verbo de ação = enquanto. Com estado (知る, いる) ou adjetivo = embora.",
x:[["狭い|ながらも、|快適な|部屋だ。","せまい ながらも、かいてきな へや だ。","Embora pequeno, é um quarto confortável."],
   ["悪いと|知り|ながら、|うそを|ついて|しまった。","わるいと しり ながら、うそを ついて しまった。","Mesmo sabendo que era errado, acabei mentindo."],
   ["残念|ながら、|参加|できません。","ざんねん ながら、さんか できません。","Infelizmente, não poderei participar."]],
q:[["子ども＿＿＿、しっかりした意見を持っている。",["ながら","ばかりか","うえに","ほど"],"こども ながら、しっかり した いけんを もって いる。","Embora criança, tem opiniões firmes.","S + ながら = embora."],
   ["体に悪いとわかってい＿＿＿、やめられない。",["ながらも","ついでに","つつある","きり"],"からだに わるいと わかって い ながらも、やめられない。","Mesmo sabendo que faz mal, não consigo parar.","Concessão enfatizada: ながらも."],
   ["この町は不便＿＿＿も、自然が豊かで住みやすい。",["ながら","なながら","だながら","にながら"],"この まちは ふべん ながらも、しぜんが ゆたかで すみやすい。","Embora esta cidade seja pouco prática, tem muita natureza e é boa para morar.","Adjetivo な sem な + ながらも: 不便ながらも."]]},

{id:"ja-tsutsumo",u:"n2-9",t:"〜つつ(も)",m:"embora (escrito); enquanto",f:"V ます-raiz + つつ(も)",
e:"Versão escrita de ながら. つつも = embora (concessão, muitas vezes com arrependimento). つつ sozinho pode ser 'enquanto'.",
c:"Muito usado com 思う, 知る, 言う: 悪いと思いつつも.",
x:[["悪いと|思い|つつも、|約束を|破って|しまった。","わるいと おもい つつも、やくそくを やぶって しまった。","Embora achasse errado, quebrei a promessa."],
   ["早く|寝ようと|思い|つつ、|また|夜更かしした。","はやく ねようと おもい つつ、また よふかし した。","Pensando em dormir cedo, fiquei acordado até tarde de novo."],
   ["景色を|楽しみ|つつ、|山道を|歩いた。","けしきを たのしみ つつ、やまみちを あるいた。","Caminhei pela trilha curtindo a paisagem."]],
q:[["体に悪いと知り＿＿＿、つい食べてしまう。",["つつも","つつある","きり","っぱなし"],"からだに わるいと しり つつも、つい たべて しまう。","Mesmo sabendo que faz mal, acabo comendo.","Concessão escrita: つつも."],
   ["音楽を聞き＿＿＿、勉強する。",["つつ","つつある","ぎみ","がち"],"おんがくを きき つつ、べんきょう する。","Estudar ouvindo música.","Simultâneo, escrito: つつ."],
   ["いけないと思い＿＿＿、また遅刻してしまった。",["つつも","ものの","ばかりに","わりに"],"いけないと おもい つつも、また ちこく して しまった。","Mesmo sabendo que não devia, me atrasei de novo.","ます-raiz + つつも."]]},

{id:"ja-monono",u:"n2-9",t:"〜ものの",m:"embora; mas (o resultado não seguiu)",f:"forma simples (な + な/である) + ものの",
e:"Reconhece A, mas o que se esperava depois não aconteceu: 買ったものの、使っていない.",
c:"けれども é neutro e falado; ものの é escrito e aponta que algo ficou incompleto.",
x:[["免許は|取った|ものの、|ほとんど|運転して|いない。","めんきょは とった ものの、ほとんど うんてん して いない。","Tirei a carteira, mas quase não dirijo."],
   ["頭では|分かって|いる|ものの、|実行は|難しい。","あたまでは わかって いる ものの、じっこうは むずかしい。","Na cabeça eu entendo, mas pôr em prática é difícil."],
   ["引き受けた|ものの、|自信が|ない。","ひきうけた ものの、じしんが ない。","Aceitei, mas não tenho confiança."]],
q:[["ジムに入会した＿＿＿、一度も行っていない。",["ものの","からこそ","だけに","うえに"],"ジムに にゅうかい した ものの、いちども いって いない。","Me matriculei na academia, mas não fui nenhuma vez.","A aconteceu, o esperado não: ものの."],
   ["新しい仕事は大変な＿＿＿、やりがいがある。",["ものの","ものだから","わけで","ことに"],"あたらしい しごとは たいへんな ものの、やりがいが ある。","O novo trabalho é pesado, mas gratificante.","な + ものの."],
   ["日本語は読める＿＿＿、話すのは苦手だ。",["ものの","ばかりか","限り","以上"],"にほんごは よめる ものの、はなすのは にがて だ。","Leio japonês, mas não sou bom em falar.","Concessão escrita: ものの."]]},

/* ---------- n2-10 ---------- */
{id:"ja-kotoda",u:"n2-10",t:"〜ことだ",m:"o melhor é; você deveria",f:"V dicionário / V ない + ことだ",
e:"Conselho de quem sabe mais para quem sabe menos: 上手になりたければ、毎日練習することだ.",
c:"Não se usa com superiores. ほうがいい é o conselho neutro.",
x:[["上手に|なりたければ、|毎日|練習する|ことだ。","じょうずに なりたければ、まいにち れんしゅう する ことだ。","Se quer melhorar, o melhor é praticar todo dia."],
   ["風邪の|ときは、|無理を|しない|ことだ。","かぜの ときは、むりを しない ことだ。","Quando estiver resfriado, o melhor é não se forçar."],
   ["合格したいなら、|まず|基礎を|固める|ことです。","ごうかく したい なら、まず きそを かためる こと です。","Se quer passar, primeiro consolide a base."]],
q:[["痩せたいなら、甘いものを食べない＿＿＿。",["ことだ","ものだ","ことか","ものか"],"やせたい なら、あまい ものを たべない ことだ。","Se quer emagrecer, o melhor é não comer doce.","Conselho: ことだ."],
   ["分からないことがあったら、すぐ質問する＿＿＿。",["ことだ","わけだ","ものだ","はずだ"],"わからない ことが あったら、すぐ しつもん する ことだ。","Se tiver dúvida, pergunte logo.","Conselho direto: ことだ."],
   ["疲れているなら、今日は早く寝る＿＿＿。",["ことだ","ことか","ことに","ことはない"],"つかれて いる なら、きょうは はやく ねる ことだ。","Se está cansado, o melhor é dormir cedo hoje.","V dicionário + ことだ."]]},

{id:"ja-monoda",u:"n2-10",t:"〜ものだ",m:"é natural que; costumava (nostalgia); é assim mesmo",f:"V dicionário + ものだ (natureza/dever); V た + ものだ (nostalgia)",
e:"1) Verdade geral ou senso comum: 人は変わるものだ. 2) Com た, lembrança de hábito passado: よく遊んだものだ. 3) Admiração: よく頑張ったものだ.",
c:"ことだ = conselho específico; ものだ = regra geral ou emoção.",
x:[["子どもの|頃は|よく|この|川で|泳いだ|ものだ。","こどもの ころは よく この かわで およいだ ものだ。","Quando criança eu nadava muito neste rio."],
   ["時間が|経つのは|早い|ものですね。","じかんが たつのは はやい もの ですね。","O tempo passa rápido mesmo, né."],
   ["人の|話は|最後まで|聞く|ものだ。","ひとの はなしは さいごまで きく ものだ。","A gente deve ouvir os outros até o fim."]],
q:[["学生時代は、毎晩友達と遅くまで話した＿＿＿。",["ものだ","ことだ","ものか","わけだ"],"がくせいじだいは、まいばん ともだちと おそくまで はなした ものだ。","Na época de estudante, conversava com amigos até tarde toda noite.","Nostalgia: たものだ."],
   ["お年寄りには席を譲る＿＿＿。",["ものだ","ことか","ものか","ばかりだ"],"おとしよりには せきを ゆずる ものだ。","Deve-se ceder o assento aos idosos.","Senso comum/dever geral: ものだ."],
   ["人生は思いどおりにならない＿＿＿。",["ものだ","ことだ","ことか","わけがない"],"じんせいは おもいどおりに ならない ものだ。","A vida não sai como a gente quer, é assim mesmo.","Verdade geral: ものだ."]]},

{id:"ja-kotoka",u:"n2-10",t:"〜ことか",m:"como...! quanto...! (emoção)",f:"forma simples (な + な/である) + ことか; costuma vir com どんなに/どれほど/何度",
e:"Exclamação de sentimento forte: どんなに心配したことか = como eu me preocupei!",
c:"ものか (com か) é negação forte: 行くものか = não vou de jeito nenhum.",
x:[["合格の|知らせを|聞いて、|どんなに|嬉しかった|ことか。","ごうかくの しらせを きいて、どんなに うれしかった ことか。","Como fiquei feliz ao saber que passei!"],
   ["何度|やめようと|思った|ことか。","なんど やめようと おもった ことか。","Quantas vezes pensei em desistir!"],
   ["一人で|どれほど|寂しかった|ことか。","ひとりで どれほど さびしかった ことか。","Como me senti sozinho!"]],
q:[["連絡がなくて、どんなに心配した＿＿＿。",["ことか","ものか","ことだ","ものだ"],"れんらくが なくて、どんなに しんぱい した ことか。","Sem notícias, como eu me preocupei!","Exclamação emocional: ことか."],
   ["この日を何年待った＿＿＿。",["ことか","ものか","わけか","はずか"],"この ひを なんねん まった ことか。","Quantos anos esperei por este dia!","何年 + ことか."],
   ["あなたに会えて、どれほど嬉しい＿＿＿。",["ことか","ものか","ことだ","ばかりか"],"あなたに あえて、どれほど うれしい ことか。","Como estou feliz em te ver!","どれほど + ことか."]]},

{id:"ja-monoka",u:"n2-10",t:"〜ものか",m:"de jeito nenhum; imagina se...",f:"forma simples (な + な) + ものか (もんか)",
e:"Negação forte com emoção: 二度と行くものか = nunca mais vou! Falado: もんか.",
c:"ことか = exclamação positiva de intensidade; ものか = recusa forte.",
x:[["あんな|店、|二度と|行く|ものか。","あんな みせ、にどと いく ものか。","Aquela loja? Nunca mais piso lá!"],
   ["負けて|たまる|ものか。","まけて たまる ものか。","Não vou perder de jeito nenhum!"],
   ["あいつの|言う|ことなんか、|信じる|もんか。","あいつの いう ことなんか、しんじる もんか。","Imagina se vou acreditar no que ele diz!"]],
q:[["こんなまずい料理、誰が食べる＿＿＿。",["ものか","ことか","ものだ","ことだ"],"こんな まずい りょうり、だれが たべる ものか。","Quem vai comer uma comida ruim dessas?!","Negação forte: ものか."],
   ["あんなひどい人に謝る＿＿＿。",["もんか","ことか","わけか","はずか"],"あんな ひどい ひとに あやまる もんか。","Pedir desculpas para uma pessoa dessas? Nunca!","Forma falada: もんか."],
   ["こんなところで諦めて＿＿＿ものか。",["たまる","いる","おく","しまう"],"こんな ところで あきらめて たまる ものか。","Não vou desistir aqui de jeito nenhum!","Expressão fixa: てたまるものか."]]},

{id:"ja-kotoni",u:"n2-10",t:"〜ことに(は)",m:"para minha (surpresa/alegria/pena)",f:"V た / adj い / adj な + な + ことに(は)",
e:"Antecipa o sentimento de quem fala sobre o fato: 驚いたことに = para minha surpresa. 残念なことに = infelizmente.",
c:"Só com palavras de emoção (嬉しい, 驚く, 残念, 困る, 不思議).",
x:[["驚いた|ことに、|彼は|もう|結婚して|いた。","おどろいた ことに、かれは もう けっこん して いた。","Para minha surpresa, ele já era casado."],
   ["嬉しい|ことに、|第一志望の|大学に|合格した。","うれしい ことに、だいいち しぼうの だいがくに ごうかく した。","Para minha alegria, passei na universidade que era minha primeira opção."],
   ["残念な|ことに、|雨で|花火大会が|中止に|なった。","ざんねんな ことに、あめで はなびたいかいが ちゅうしに なった。","Infelizmente, o festival de fogos foi cancelado pela chuva."]],
q:[["困った＿＿＿、財布を家に忘れてきた。",["ことに","ものに","ことか","わけに"],"こまった ことに、さいふを いえに わすれて きた。","Que problema: esqueci a carteira em casa.","Sentimento antecipado: たことに."],
   ["不思議な＿＿＿、同じ夢を三回も見た。",["ことに","もので","ことか","ものか"],"ふしぎな ことに、おなじ ゆめを さんかいも みた。","Estranhamente, tive o mesmo sonho três vezes.","な-adj + な + ことに."],
   ["ありがたい＿＿＿、多くの人が手伝ってくれた。",["ことに","ものだ","ことだ","わけで"],"ありがたい ことに、おおくの ひとが てつだって くれた。","Felizmente, muita gente me ajudou.","い-adj + ことに."]]},

/* ---------- n2-11 ---------- */
{id:"ja-kanenai",u:"n2-11",t:"〜かねない",m:"pode acabar (algo ruim)",f:"V ます-raiz + かねない",
e:"Possibilidade de algo ruim acontecer: そんな運転をしたら、事故を起こしかねない.",
c:"Forma afirmativa em sentido (pode acontecer), apesar do ない. Só para resultados negativos.",
x:[["そんな|ことを|言ったら、|誤解され|かねない。","そんな ことを いったら、ごかい され かねない。","Se disser isso, pode acabar sendo mal interpretado."],
   ["寝不足は|病気の|原因に|なり|かねない。","ねぶそくは びょうきの げんいんに なり かねない。","Falta de sono pode acabar causando doenças."],
   ["彼なら|約束を|忘れ|かねない。","かれ なら やくそくを わすれ かねない。","Conhecendo ele, é capaz de esquecer o combinado."]],
q:[["スピードを出しすぎると、事故を起こし＿＿＿。",["かねない","かねる","得る","っこない"],"スピードを だしすぎると、じこを おこし かねない。","Correndo demais, pode acabar causando um acidente.","Risco de algo ruim: かねない."],
   ["このままでは、会社が倒産し＿＿＿。",["かねない","かねる","がちだ","つつある"],"この ままでは、かいしゃが とうさん し かねない。","Assim, a empresa pode acabar falindo.","ます-raiz + かねない."],
   ["無理をすると、体を壊し＿＿＿よ。",["かねない","っこない","ものか","ことだ"],"むりを すると、からだを こわし かねない よ。","Se se forçar, pode acabar adoecendo.","Resultado ruim possível: かねない."]]},

{id:"ja-kaneru",u:"n2-11",t:"〜かねる",m:"não poder (educadamente); ter dificuldade em",f:"V ます-raiz + かねる",
e:"Recusa educada em negócios: お答えしかねます = não posso responder. Significa 'não posso', apesar de não ter ない.",
c:"かねない = pode acontecer (ruim); かねる = não posso fazer.",
x:[["その|ご質問には|お答え|しかねます。","その ごしつもんには おこたえ しかねます。","Não posso responder a essa pergunta."],
   ["申し訳ありませんが、|返品は|お受け|しかねます。","もうしわけ ありませんが、へんぴんは おうけ しかねます。","Sinto muito, mas não podemos aceitar devolução."],
   ["彼の|意見には|賛成し|かねる。","かれの いけんには さんせい し かねる。","Tenho dificuldade em concordar com a opinião dele."]],
q:[["個人情報についてはお教えし＿＿＿。",["かねます","かねません","得ます","がちです"],"こじんじょうほうに ついては おおしえ し かねます。","Não podemos informar dados pessoais.","Recusa educada: かねます."],
   ["この件は私一人では決め＿＿＿ので、上司に相談します。",["かねます","かねない","っこない","つつある"],"この けんは わたし ひとりでは きめ かねます ので、じょうしに そうだん します。","Não posso decidir isso sozinho, vou consultar meu chefe.","Não posso: かねる."],
   ["見るに見＿＿＿、手伝うことにした。",["かねて","かねない","得て","っぱなしで"],"みるに みかねて、てつだう ことに した。","Não aguentei só ficar olhando e decidi ajudar.","Expressão fixa: 見るに見かねて."]]},

{id:"ja-uru",u:"n2-11",t:"〜得る / 得ない",m:"é possível / é impossível",f:"V ます-raiz + 得(う・え)る / 得(え)ない",
e:"Possibilidade lógica, formal: 起こり得る (pode acontecer). ありえない = impossível (muito usado na fala).",
c:"Não é para capacidade pessoal (泳げる), e sim possibilidade de algo acontecer.",
x:[["地震は|いつでも|起こり|得る。","じしんは いつでも おこり うる。","Terremotos podem acontecer a qualquer momento."],
   ["そんな|ことは|あり|得ない。","そんな ことは あり えない。","Isso é impossível."],
   ["考え|得る|すべての|方法を|試した。","かんがえ うる すべての ほうほうを ためした。","Tentei todos os métodos possíveis."]],
q:[["人間だから、ミスは誰にでもあり＿＿＿ことだ。",["得る","かねる","っこない","がちな"],"にんげん だから、ミスは だれにでも あり うる ことだ。","Somos humanos, erros podem acontecer com qualquer um.","Possibilidade: あり得る."],
   ["彼が犯人だなんて、あり＿＿＿。",["得ない","かねない","っこない","かねる"],"かれが はんにん だなんて、あり えない。","Ele ser o culpado? Impossível.","ありえない = impossível."],
   ["これは十分予想し＿＿＿結果だ。",["得た","かねた","きった","ぎみの"],"これは じゅうぶん よそう し えた けっかだ。","Este é um resultado que dava para prever.","Possível de prever: 予想し得た."]]},

{id:"ja-kkonai",u:"n2-11",t:"〜っこない",m:"não tem como (falado)",f:"V ます-raiz + っこない",
e:"Forma falada e forte de はずがない: できっこない = não tem como conseguir.",
c:"Só em conversa informal.",
x:[["一日で|全部|覚えられっこない。","いちにちで ぜんぶ おぼえられっこない。","Não tem como decorar tudo em um dia."],
   ["そんな|話、|誰も|信じっこないよ。","そんな はなし、だれも しんじっこない よ。","Ninguém vai acreditar numa história dessas."],
   ["今から|走っても、|間に合いっこない。","いまから はしっても、まにあいっこない。","Mesmo correndo agora, não tem como chegar a tempo."]],
q:[["こんなに難しい問題、子どもに解けっ＿＿＿。",["こない","かねない","えない","かねる"],"こんなに むずかしい もんだい、こどもに とけっこない。","Um problema difícil desses, criança nenhuma resolve.","Falado forte: っこない."],
   ["彼が約束を守りっ＿＿＿よ。",["こない","かねない","ぎみだ","がちだ"],"かれが やくそくを まもりっこない よ。","Não tem como ele cumprir a promessa.","ます-raiz + っこない."],
   ["宝くじなんて当たりっこない＿＿＿、つい買ってしまう。",["のに","ので","から","ために"],"たからくじ なんて あたりっこない のに、つい かって しまう。","Não tem como ganhar na loteria, mas acabo comprando.","っこない + のに (contraste)."]]},

{id:"ja-osoregaaru",u:"n2-11",t:"〜おそれがある",m:"há risco de",f:"V dicionário / S + の + おそれがある",
e:"Formal, em notícias e avisos: 大雨のおそれがある = há risco de chuva forte.",
c:"かねない é falado/avaliação pessoal; おそれがある é aviso oficial.",
x:[["明日は|大雨の|おそれが|あります。","あしたは おおあめの おそれが あります。","Amanhã há risco de chuva forte."],
   ["この|薬は|副作用が|出る|おそれが|ある。","この くすりは ふくさようが でる おそれが ある。","Este remédio tem risco de efeito colateral."],
   ["津波の|おそれは|ありません。","つなみの おそれは ありません。","Não há risco de tsunami."]],
q:[["台風の影響で、川があふれる＿＿＿。",["おそれがある","かねる","っこない","ものだ"],"たいふうの えいきょうで、かわが あふれる おそれが ある。","Por causa do tufão, há risco de o rio transbordar.","Aviso formal: おそれがある."],
   ["このままでは、絶滅の＿＿＿がある。",["おそれ","かね","はず","わけ"],"この ままでは、ぜつめつの おそれが ある。","Assim, há risco de extinção.","S + の + おそれ."],
   ["個人情報が漏れる＿＿＿があるので、注意してください。",["おそれ","ところ","ばかり","もの"],"こじんじょうほうが もれる おそれが ある ので、ちゅうい して ください。","Há risco de vazamento de dados pessoais, tome cuidado.","V dicionário + おそれがある."]]},

/* ---------- n2-12 ---------- */
{id:"ja-dokoroka",u:"n2-12",t:"〜どころか",m:"longe de; em vez de... (pelo contrário)",f:"forma simples (な/S sem だ) + どころか",
e:"Nega A com força e apresenta algo oposto ou muito mais extremo: 痩せるどころか、太った.",
c:"ばかりか soma na mesma direção; どころか costuma inverter a expectativa.",
x:[["薬を|飲んだが、|治る|どころか、|悪く|なった。","くすりを のんだが、なおる どころか、わるく なった。","Tomei remédio, e longe de melhorar, piorei."],
   ["貯金|どころか、|借金が|ある。","ちょきん どころか、しゃっきんが ある。","Longe de ter poupança, tenho dívida."],
   ["漢字|どころか、|ひらがなも|読めない。","かんじ どころか、ひらがなも よめない。","Longe de ler kanji, não leio nem hiragana."]],
q:[["ダイエットしているのに、痩せる＿＿＿太ってしまった。",["どころか","ばかりか","うえに","ものの"],"ダイエット して いる のに、やせる どころか ふとって しまった。","Estou de dieta, mas longe de emagrecer, engordei.","Resultado oposto: どころか."],
   ["忙しくて、旅行＿＿＿、週末も休めない。",["どころか","として","にしては","に対して"],"いそがしくて、りょこう どころか、しゅうまつも やすめない。","Tão ocupado que, longe de viajar, nem descanso no fim de semana.","S + どころか."],
   ["彼は謝る＿＿＿、逆に怒り出した。",["どころか","ために","ように","ばかりに"],"かれは あやまる どころか、ぎゃくに おこりだした。","Longe de pedir desculpas, ele ficou bravo.","Inversão: どころか."]]},

{id:"ja-toiuyori",u:"n2-12",t:"〜というより",m:"mais do que; em vez de dizer que",f:"forma simples (な/S às vezes sem だ) + というより",
e:"Corrige a descrição para uma mais exata: 暖かいというより暑い = mais do que quente, está calor.",
c:"むしろ costuma acompanhar: AというよりむしろB.",
x:[["今日は|暖かい|というより|暑い。","きょうは あたたかい と いうより あつい。","Hoje, mais do que morno, está quente."],
   ["彼は|友達|というより|家族の|ような|存在だ。","かれは ともだち と いうより かぞくの ような そんざい だ。","Ele é mais família do que amigo."],
   ["これは|料理|というより|芸術だ。","これは りょうり と いうより げいじゅつ だ。","Isto é mais arte do que comida."]],
q:[["この部屋は広い＿＿＿、何もなくて寂しい感じだ。",["というより","どころか","ばかりか","にしては"],"この へやは ひろい と いうより、なにも なくて さびしい かんじ だ。","Mais do que espaçoso, este quarto parece vazio e triste.","Corrigir a descrição: というより."],
   ["彼の話は説明＿＿＿言い訳だ。",["というより","に対して","にとって","として"],"かれの はなしは せつめい と いうより いいわけ だ。","O que ele diz é mais desculpa do que explicação.","S + というより."],
   ["疲れた＿＿＿むしろ眠い。",["というより","ばかりに","あまり","以上"],"つかれた と いうより むしろ ねむい。","Mais do que cansado, estou com sono.","というより + むしろ."]]},

{id:"ja-muke",u:"n2-12",t:"〜向け / 〜向き",m:"feito para / adequado para",f:"S + 向(む)け (destinado a); S + 向(む)き (adequado a)",
e:"向け = feito de propósito para um público (子ども向けの本). 向き = serve bem, por natureza (初心者向きのコース).",
c:"向けに作る (fazer para); 向きだ (é adequado).",
x:[["これは|子ども|向けの|番組だ。","これは こども むけの ばんぐみ だ。","Este é um programa feito para crianças."],
   ["この|山は|初心者|向きだ。","この やまは しょしんしゃ むき だ。","Esta montanha é adequada para iniciantes."],
   ["外国人|向けに|作られた|ガイドブック。","がいこくじん むけに つくられた ガイドブック。","Um guia feito para estrangeiros."]],
q:[["このマンションは一人暮らし＿＿＿に設計されている。",["向け","向き","として","ごと"],"この マンションは ひとりぐらし むけに せっけい されて いる。","Este apartamento foi projetado para quem mora sozinho.","Feito de propósito para: 向け."],
   ["この仕事は細かい作業が好きな人＿＿＿だ。",["向き","向け","だけ","ほど"],"この しごとは こまかい さぎょうが すきな ひと むき だ。","Este trabalho é adequado para quem gosta de tarefas detalhadas.","Adequado por natureza: 向き."],
   ["高齢者＿＿＿のスマホが売れている。",["向け","向き","ぎみ","がち"],"こうれいしゃ むけの スマホが うれて いる。","Celulares feitos para idosos estão vendendo bem.","Produto destinado a: 向け."]]},

{id:"ja-bakarini",u:"n2-12",t:"〜ばかりに",m:"só porque (resultado ruim)",f:"forma simples (な + な/である, S + である) + ばかりに",
e:"Uma única causa, muitas vezes pequena, gerou um resultado ruim e lamentado. たいばかりに = de tanto querer.",
c:"せいで é neutro na culpa; ばかりに destaca 'só por causa disso'.",
x:[["一言|多かった|ばかりに、|彼女を|怒らせて|しまった。","ひとこと おおかった ばかりに、かのじょを おこらせて しまった。","Só por falar uma palavra a mais, deixei ela brava."],
   ["お金が|ない|ばかりに、|進学を|諦めた。","おかねが ない ばかりに、しんがくを あきらめた。","Só por não ter dinheiro, desisti de continuar os estudos."],
   ["彼女に|会いたい|ばかりに、|毎日|その|店に|通った。","かのじょに あいたい ばかりに、まいにち その みせに かよった。","De tanto querer vê-la, ia àquela loja todo dia."]],
q:[["パスワードを忘れた＿＿＿、一日仕事ができなかった。",["ばかりに","ばかりか","ばかりで","どころか"],"パスワードを わすれた ばかりに、いちにち しごとが できなかった。","Só por esquecer a senha, fiquei um dia sem trabalhar.","Causa única, resultado ruim: ばかりに."],
   ["早く帰りたい＿＿＿、書類をよく確認しなかった。",["ばかりに","ために","ように","ことに"],"はやく かえりたい ばかりに、しょるいを よく かくにん しなかった。","De tanta vontade de ir embora, não conferi os documentos.","たいばかりに."],
   ["英語ができない＿＿＿、いい仕事が見つからない。",["ばかりに","おかげで","だけあって","からこそ"],"えいごが できない ばかりに、いい しごとが みつからない。","Só por não saber inglês, não acho um bom emprego.","Lamento: ばかりに."]]},

{id:"ja-karaniwa",u:"n2-12",t:"〜からには",m:"já que; uma vez que (então)",f:"forma simples (な/S + である) + からには",
e:"Já que A, então B com determinação, dever ou forte vontade: 留学するからには、しっかり勉強したい.",
c:"以上(は) tem o mesmo sentido, mais formal.",
x:[["やる|からには、|最後まで|頑張ろう。","やる から には、さいごまで がんばろう。","Já que vamos fazer, vamos até o fim."],
   ["日本に|来た|からには、|日本語を|マスターしたい。","にほんに きた から には、にほんごを マスター したい。","Já que vim ao Japão, quero dominar o japonês."],
   ["約束した|からには、|守るべきだ。","やくそく した から には、まもる べきだ。","Uma vez que prometeu, deve cumprir."]],
q:[["試合に出る＿＿＿、優勝を目指す。",["からには","ものの","わりに","ばかりに"],"しあいに でる から には、ゆうしょうを めざす。","Já que vou competir, miro o título.","Já que → determinação: からには."],
   ["リーダーになった＿＿＿、責任を持たなければならない。",["からには","くせに","どころか","うちに"],"リーダーに なった から には、せきにんを もたなければ ならない。","Já que virei líder, tenho que assumir a responsabilidade.","Dever depois de からには."],
   ["高いお金を払った＿＿＿、しっかり楽しもう。",["からには","ばかりか","だけあって","にしても"],"たかい おかねを はらった から には、しっかり たのしもう。","Já que pagamos caro, vamos aproveitar bem.","Vontade forte: からには."]]},
/* ---------- n2-13 (keigo) ---------- */
{id:"ja-sonkei-verbos",u:"n2-13",t:"尊敬語: verbos especiais",m:"verbos de respeito (ação do outro)",f:"いる/行く/来る→いらっしゃる · 言う→おっしゃる · 食べる/飲む→召し上がる · 見る→ご覧になる · する→なさる · 知っている→ご存じだ",
e:"尊敬語 eleva a ação de quem você respeita (cliente, chefe, professor). Nunca use para você mesmo. Os verbos mais frequentes têm formas próprias.",
c:"いらっしゃる conjuga como いらっしゃいます (não いらっしゃります). Mesmo padrão: おっしゃいます, なさいます.",
x:[["社長は|今|会議室に|いらっしゃいます。","しゃちょうは いま かいぎしつに いらっしゃいます。","O presidente está na sala de reunião agora."],
   ["先生が|おっしゃった|ことを|メモしました。","せんせいが おっしゃった ことを メモしました。","Anotei o que o professor disse."],
   ["どうぞ|召し上がって|ください。","どうぞ めしあがって ください。","Por favor, sirva-se."]],
q:[["部長はもうお昼を＿＿＿か。",["召し上がりました","いただきました","食べられました","参りました"],"ぶちょうは もう おひるを めしあがりました か。","O gerente já almoçou?","Ação do chefe (comer) → 尊敬語 召し上がる. いただく é humilde, para você."],
   ["この件について、何か＿＿＿か。",["ご存じです","存じています","知られます","ご存じします"],"この けんに ついて、なにか ごぞんじ です か。","O senhor sabe algo sobre este assunto?","知っている do outro → ご存じだ. 存じている é humilde."],
   ["お客様が受付で待って＿＿＿。",["いらっしゃいます","おります","まいります","ございます"],"おきゃくさまが うけつけで まって いらっしゃいます。","O cliente está esperando na recepção.","ている do cliente → ていらっしゃる. ておる é humilde."]]},

{id:"ja-o-ninaru",u:"n2-13",t:"お〜になる / ご〜になる",m:"respeito com qualquer verbo",f:"お + V ます-raiz + になる (verbos japoneses) · ご + substantivo chinês + になる",
e:"Fórmula geral de 尊敬語 quando o verbo não tem forma especial: 帰る→お帰りになる, 利用する→ご利用になる. Em avisos aparece a forma de pedido お〜ください.",
c:"Verbos com forma especial usam a especial: 見る→ご覧になる (não お見になる); 来る→いらっしゃる.",
x:[["部長は|もう|お帰りに|なりました。","ぶちょうは もう おかえりに なりました。","O gerente já foi embora."],
   ["この|資料を|お読みに|なりましたか。","この しりょうを およみに なりましたか。","O senhor leu este material?"],
   ["こちらの|会議室を|ご利用に|なれます。","こちらの かいぎしつを ごりように なれます。","O senhor pode usar esta sala de reunião."]],
q:[["先生はいつ日本に＿＿＿か。",["お戻りになります","お戻りします","戻らせます","お戻りになさいます"],"せんせいは いつ にほんに おもどりに なります か。","Quando o professor volta ao Japão?","Ação do professor → お + ます-raiz + になる."],
   ["社長はこの書類をもう＿＿＿。",["ご覧になりました","お見になりました","拝見しました","見られました"],"しゃちょうは この しょるいを もう ごらんに なりました。","O presidente já viu este documento.","見る tem forma especial: ご覧になる. 拝見する é humilde."],
   ["このサービスは会員の方がご＿＿＿なれます。",["利用に","利用して","利用し","利用を"],"この サービスは かいいんの かたが ごりように なれます。","Este serviço pode ser usado pelos sócios.","ご + substantivo + になる (aqui no potencial: になれる)."]]},

{id:"ja-kenjo-verbos",u:"n2-13",t:"謙譲語: verbos especiais",m:"verbos humildes (sua própria ação)",f:"行く/来る→参る・伺う · 言う→申す · 食べる/もらう→いただく · 見る→拝見する · 知っている→存じている · いる→おる · する→いたす",
e:"謙譲語 rebaixa a sua ação diante de quem você respeita. É o que você usa ao falar de si com cliente, chefe ou em entrevista.",
c:"伺う = visitar ou perguntar (humilde). 参る é mais neutro-formal para ir/vir; 伺う tem alvo (a casa/empresa do outro).",
x:[["明日、|御社に|伺います。","あした、おんしゃに うかがいます。","Amanhã irei até a sua empresa."],
   ["田中と|申します。","たなかと もうします。","Meu nome é Tanaka."],
   ["資料を|拝見しました。","しりょうを はいけん しました。","Vi o material (com respeito)."]],

{id:"ja-o-suru",u:"n2-13",t:"お〜する / ご〜する",m:"humilde com qualquer verbo (faço para você)",f:"お + V ます-raiz + する・いたす · ご + substantivo chinês + する・いたす",

{id:"ja-itadakemasuka",u:"n2-13",t:"Pedidos formais",m:"poderia...? / por favor...",f:"V て + いただけますか / いただけないでしょうか · お + ます-raiz + ください · ご + substantivo + ください",

   ["参加費は|1人に|つき|500円です。","さんかひは ひとりに つき ごひゃくえん です。","A taxa de participação é de 500 ienes por pessoa."],
   ["本日は|定休日に|つき、|お休みです。","ほんじつは ていきゅうびに つき、おやすみ です。","Hoje é nosso dia de folga fixa: estamos fechados."]],
q:[["改装中＿＿＿、しばらく休業いたします。",["につき","について","にとって","に対して"],"かいそうちゅう に つき、しばらく きゅうぎょう いたします。","Devido à reforma, ficaremos fechados por um tempo.","Motivo em aviso: につき."],
   ["駐車料金は1時間＿＿＿300円です。",["につき","ごとで","あたりに","ずつに"],"ちゅうしゃ りょうきんは いちじかん に つき さんびゃくえん です。","O estacionamento custa 300 ienes por hora.","Por unidade: につき."],
   ["雨天＿＿＿、運動会は延期します。",["につき","にとって","として","をもとに"],"うてん に つき、うんどうかいは えんき します。","Por causa da chuva, a gincana foi adiada.","Aviso formal com motivo: につき."]]},

{id:"ja-niyotte",u:"n2-15",t:"〜によって / による",m:"por (agente/causa/meio); depende de",f:"S + によって / により / による + S",
e:"Quatro usos: 1) agente na passiva (ピカソによって描かれた), 2) causa (地震による被害), 3) meio (話し合いによって解決), 4) variação (人によって違う).",
c:"によると / によれば = segundo (fonte de informação), outra estrutura.",
x:[["この|絵は|ピカソに|よって|描かれた。","この えは ピカソに よって えがかれた。","Este quadro foi pintado por Picasso."],
   ["考え方は|人に|よって|違う。","かんがえかたは ひとに よって ちがう。","O modo de pensar varia de pessoa para pessoa."],
   ["地震に|よる|被害は|大きかった。","じしんに よる ひがいは おおきかった。","Os danos causados pelo terremoto foram grandes."]],
q:[["電話は1876年にベル＿＿＿発明された。",["によって","にとって","について","に対して"],"でんわは せんはっぴゃくななじゅうろくねんに ベル に よって はつめい された。","O telefone foi inventado por Bell em 1876.","Agente na passiva formal: によって."],
   ["国＿＿＿習慣が違う。",["によって","にとって","として","に関して"],"くに に よって しゅうかんが ちがう。","Os costumes variam de país para país.","Variação: によって."],
   ["大雨＿＿＿土砂崩れが起きた。",["による","にとっての","についての","に対する"],"おおあめ に よる どしゃくずれが おきた。","Houve um deslizamento causado pela chuva forte.","Causa antes de substantivo: による."]]},

/* ---------- n2-16 ---------- */
{id:"ja-tetamaranai",u:"n2-16",t:"〜てたまらない",m:"estar morrendo de; não aguentar de tanto",f:"adj い → くてたまらない · adj な → でたまらない · V て + たまらない",
e:"Sentimento ou sensação física muito forte de quem fala: 暑くてたまらない, 会いたくてたまらない.",
c:"Sujeito em 1ª pessoa. Para outra pessoa, some がる: 彼は寂しがっている.",
x:[["暑くて|たまらない。","あつくて たまらない。","Está um calor insuportável."],
   ["家族に|会いたくて|たまらない。","かぞくに あいたくて たまらない。","Estou morrendo de saudade da família."],
   ["試験の|結果が|心配で|たまらない。","しけんの けっかが しんぱいで たまらない。","Estou morrendo de preocupação com o resultado da prova."]],
q:[["朝から何も食べていないので、お腹がすいて＿＿＿。",["たまらない","ならない","かねない","っこない"],"あさから なにも たべて いない ので、おなかが すいて たまらない。","Não comi nada desde cedo, estou morrendo de fome.","Sensação física forte: てたまらない."],
   ["この歌を聞くと、国が懐かしく＿＿＿たまらない。",["て","に","で","と"],"この うたを きくと、くにが なつかしくて たまらない。","Ouvindo esta música, morro de saudade do meu país.","Adjetivo い: くて + たまらない."],
   ["一人暮らしは寂し＿＿＿たまらない。",["くて","いで","さで","そうで"],"ひとりぐらしは さびしくて たまらない。","Morar sozinho é solitário demais.","寂しい → 寂しくてたまらない."]]},

{id:"ja-tenaranai",u:"n2-16",t:"〜てならない",m:"não consigo deixar de sentir",f:"V て / adj い → くて / adj な → で + ならない",
e:"Sentimento que surge sozinho e não se controla, mais contido e escrito que たまらない: 気がしてならない, 残念でならない.",
c:"Muito usado com 気がする, 思える, 残念, 心配. Não é usado para sensação física como 暑い.",
x:[["彼が|うそを|ついている|気が|してならない。","かれが うそを ついて いる きが して ならない。","Não consigo deixar de sentir que ele está mentindo."],
   ["あの|試合に|負けたのが|残念で|ならない。","あの しあいに まけたのが ざんねんで ならない。","Ainda lamento muito ter perdido aquele jogo."],
   ["息子の|将来が|心配で|ならない。","むすこの しょうらいが しんぱいで ならない。","Não consigo parar de me preocupar com o futuro do meu filho."]],
q:[["何か大切なことを忘れている気がして＿＿＿。",["ならない","たまらない","しかたない","かねない"],"なにか たいせつな ことを わすれて いる きが して ならない。","Não consigo deixar de sentir que esqueci algo importante.","気がしてならない é a combinação típica."],
   ["恩師が亡くなったと聞いて、悲しく＿＿＿ならない。",["て","に","で","と"],"おんしが なくなったと きいて、かなしくて ならない。","Soube que meu antigo professor faleceu e não consigo conter a tristeza.","い-adj: くて + ならない."],
   ["チャンスを逃したのが悔やまれて＿＿＿。",["ならない","いられない","しまわない","おかない"],"チャンスを のがしたのが くやまれて ならない。","Não consigo parar de lamentar ter perdido a chance.","Sentimento espontâneo (verbo espontâneo 悔やまれる): てならない."]]},

{id:"ja-teshouganai",u:"n2-16",t:"〜てしょうがない / て仕方がない",m:"não tem jeito de tão; estar muito",f:"V て / adj い → くて / adj な → で + しょうがない・仕方(しかた)がない",
e:"Forma falada de sentimento ou estado intenso: 眠くてしょうがない. 仕方がない é um pouco mais formal.",
c:"たまらない é quase igual; しょうがない soa mais casual e também aparece com irritação: うるさくてしょうがない.",
x:[["昨日|あまり|寝て|いないので、|眠くて|しょうがない。","きのう あまり ねて いない ので、ねむくて しょうがない。","Dormi pouco ontem, estou morto de sono."],
   ["隣の|工事が|うるさくて|仕方が|ない。","となりの こうじが うるさくて しかたが ない。","A obra do vizinho está barulhenta demais."],
   ["明日の|旅行が|楽しみで|しょうがない。","あしたの りょこうが たのしみで しょうがない。","Estou ansiosíssimo pela viagem de amanhã."]],
q:[["風邪をひいて、咳が出て＿＿＿。",["しょうがない","ならない","かねない","ほかない"],"かぜを ひいて、せきが でて しょうがない。","Peguei resfriado e não paro de tossir.","Estado intenso falado: てしょうがない."],
   ["新しいゲームがやりたくて＿＿＿がない。",["仕方","しかも","わけ","はず"],"あたらしい ゲームが やりたくて しかたが ない。","Estou louco para jogar o jogo novo.","て仕方がない."],
   ["この部屋は日当たりが悪くて、寒くて＿＿＿。",["しょうがない","ものか","ことか","わけだ"],"この へやは ひあたりが わるくて、さむくて しょうがない。","Este quarto pega pouco sol e é frio demais.","くて + しょうがない."]]},

{id:"ja-monogaaru",u:"n2-16",t:"〜ものがある",m:"há algo de (sentimento); é realmente",f:"forma simples (adj い / adj な + な / V) + ものがある",
e:"Expressa uma impressão forte de quem fala sobre algo, sem afirmar diretamente: 彼の演奏には人を感動させるものがある.",
c:"Soa mais contido e sofisticado que só 感動的だ. Comum em críticas e comentários.",
x:[["彼の|歌には|人の|心を|打つ|ものが|ある。","かれの うたには ひとの こころを うつ ものが ある。","O canto dele tem algo que toca o coração das pessoas."],
   ["一人で|海外で|暮らすのは|寂しい|ものが|ある。","ひとりで かいがいで くらすのは さびしい ものが ある。","Morar sozinho no exterior tem algo de solitário."],
   ["毎日|3時間|通勤するのは|つらい|ものが|ある。","まいにち さんじかん つうきん するのは つらい ものが ある。","Viajar três horas por dia para o trabalho é realmente penoso."]],
q:[["この作家の文章には、読む人を引きつける＿＿＿。",["ものがある","ことがある","わけがある","はずがある"],"この さっかの ぶんしょうには、よむ ひとを ひきつける ものが ある。","A escrita deste autor tem algo que atrai o leitor.","Impressão forte: ものがある."],
   ["長年住んだ家を離れるのは、つらい＿＿＿がある。",["もの","こと","わけ","ところ"],"ながねん すんだ いえを はなれるのは、つらい ものが ある。","Deixar a casa onde vivi tantos anos é realmente doloroso.","い-adj + ものがある."],
   ["新人とは思えない彼の実力には、驚くべき＿＿＿。",["ものがある","ことだ","わけではない","はずだ"],"しんじんとは おもえない かれの じつりょくには、おどろく べき ものが ある。","A habilidade dele, que nem parece de novato, tem algo de surpreendente.","Avaliação forte: ものがある."]]},

{id:"ja-ge",u:"n2-16",t:"〜げ",m:"com ar de; parecendo (sentimento)",f:"adj い sem い / adj な / V ます-raiz + げ (な + S / に + V)",
e:"Mostra o sentimento que se vê no rosto ou no jeito de alguém: 寂しげな顔, 楽しげに話す. Estilo um pouco literário.",
c:"そう também indica aparência, mas げ é mais descritivo e usado para emoções. いい vira よさげ só na gíria.",
x:[["彼女は|寂しげな|顔で|窓の|外を|見て|いた。","かのじょは さびしげな かおで まどの そとを みて いた。","Ela olhava pela janela com ar tristonho."],
   ["子どもたちが|楽しげに|遊んで|いる。","こどもたちが たのしげに あそんで いる。","As crianças brincam com ar alegre."],
   ["彼は|何か|言いたげだった。","かれは なにか いいたげ だった。","Ele parecia querer dizer algo."]],
q:[["母は心配＿＿＿な顔で私を見た。",["げ","っぽい","がち","気味"],"ははは しんぱいげな かおで わたしを みた。","Minha mãe me olhou com cara de preocupação.","Sentimento visível: げ."],
   ["彼は自信あり＿＿＿に笑った。",["げ","そう","よう","らしい"],"かれは じしん ありげに わらった。","Ele sorriu com ar confiante.","ありげ = com ar de ter."],
   ["その犬は悲し＿＿＿に鳴いていた。",["げ","がち","っぽさ","さ"],"その いぬは かなしげに ないて いた。","O cachorro gania com ar triste.","い-adj sem い + げ + に."]]},

/* ---------- n2-17 ---------- */
{id:"ja-nichigainai",u:"n2-17",t:"〜に違いない",m:"sem dúvida; com certeza (dedução)",f:"forma simples (な/S sem だ) + に違(ちが)いない",
e:"Dedução forte baseada em indícios, estilo escrito: 犯人は彼に違いない.",
c:"はずだ se baseia em lógica/expectativa; に違いない é convicção pessoal forte. Na fala: きっと〜だと思う.",
x:[["部屋が|暗い。|もう|寝たに|違いない。","へやが くらい。もう ねたに ちがいない。","O quarto está escuro. Com certeza já dormiu."],
   ["あの|店は|いつも|行列だ。|おいしいに|違いない。","あの みせは いつも ぎょうれつ だ。おいしいに ちがいない。","Aquela loja sempre tem fila. Deve ser gostosa."],
   ["この|字は|田中さんの|字に|違いない。","この じは たなかさんの じに ちがいない。","Esta letra é sem dúvida do Tanaka."]],
q:[["彼の顔色が悪い。何かあった＿＿＿。",["に違いない","わけがない","にすぎない","ことはない"],"かれの かおいろが わるい。なにか あったに ちがいない。","Ele está pálido. Com certeza aconteceu algo.","Dedução forte: に違いない."],
   ["あれほど練習したのだから、合格する＿＿＿。",["に違いない","とは限らない","わけではない","ものか"],"あれほど れんしゅう した のだから、ごうかく するに ちがいない。","Treinou tanto que com certeza vai passar.","Convicção: に違いない."],
   ["この財布は姉のもの＿＿＿。",["に違いない","だに違いない","なに違いない","のに違いない"],"この さいふは あねの ものに ちがいない。","Esta carteira com certeza é da minha irmã.","Substantivo sem だ + に違いない."]]},

{id:"ja-nikimatteiru",u:"n2-17",t:"〜に決まっている",m:"é claro que; só pode ser",f:"forma simples (な/S sem だ) + に決(き)まっている",
e:"Certeza subjetiva e falada, às vezes teimosa: そんなの無理に決まっている.",
c:"に違いない é mais escrito; に決まっている é da conversa e pode soar arrogante.",
x:[["そんな|高い|店、|高いに|決まってる。","そんな たかい みせ、たかいに きまってる。","Uma loja dessas, claro que é cara."],
   ["練習しなければ、|負けるに|決まっている。","れんしゅう しなければ、まけるに きまって いる。","Se não treinar, é claro que vai perder."],
   ["一人で|全部|やるなんて|無理に|決まってるよ。","ひとりで ぜんぶ やるなんて むりに きまってる よ。","Fazer tudo sozinho? Claro que é impossível."]],
q:[["子どもに聞いたら、遊びたいと言う＿＿＿。",["に決まっている","にすぎない","ほかない","わけがない"],"こどもに きいたら、あそびたいと いうに きまって いる。","Se perguntar às crianças, é claro que vão dizer que querem brincar.","Certeza falada: に決まっている."],
   ["こんな時間に電話してくるのは、彼＿＿＿。",["に決まっている","だに決まっている","にほかならない","ものか"],"こんな じかんに でんわ して くるのは、かれに きまって いる。","Quem liga uma hora dessas só pode ser ele.","Substantivo sem だ + に決まっている."],
   ["準備なしで試験を受けたら、落ちる＿＿＿よ。",["に決まってる","とは限らない","わけではない","ことはない"],"じゅんび なしで しけんを うけたら、おちるに きまってる よ。","Fazer a prova sem se preparar? Claro que vai reprovar.","Forma falada: に決まってる."]]},

{id:"ja-nisuginai",u:"n2-17",t:"〜にすぎない",m:"não passa de; é apenas",f:"forma simples (な/S sem だ, S + である) + にすぎない",
e:"Minimiza algo: é só isso, nada mais. これは一つの例にすぎない.",
c:"だけだ é neutro; にすぎない enfatiza que é pouco ou sem importância.",
x:[["これは|一つの|例に|すぎない。","これは ひとつの れいに すぎない。","Isto não passa de um exemplo."],
   ["私は|自分の|仕事を|した|にすぎません。","わたしは じぶんの しごとを した に すぎません。","Eu apenas fiz o meu trabalho."],
   ["参加者は|わずか|10人に|すぎなかった。","さんかしゃは わずか じゅうにんに すぎなかった。","Os participantes não passaram de apenas dez pessoas."]],
q:[["それはうわさ＿＿＿。本気にしないで。",["にすぎない","に違いない","に決まっている","にほかならない"],"それは うわさに すぎない。ほんきに しないで。","Isso não passa de boato. Não leve a sério.","Minimizar: にすぎない."],
   ["私は社長の指示に従った＿＿＿。",["にすぎません","に違いありません","に限ります","に決まっています"],"わたしは しゃちょうの しじに したがった に すぎません。","Eu apenas segui as instruções do presidente.","Não fiz nada além disso: にすぎない."],
   ["日本語が話せると言っても、あいさつ程度＿＿＿。",["にすぎない","にほかならない","に違いない","とは限らない"],"にほんごが はなせると いっても、あいさつ ていどに すぎない。","Digo que falo japonês, mas não passa de cumprimentos.","にすぎない."]]},

{id:"ja-nihokanaranai",u:"n2-17",t:"〜にほかならない",m:"não é senão; é exatamente",f:"S + にほかならない; (理由) から + にほかならない",
e:"Afirma com força que é isso e nada mais: 成功は努力の結果にほかならない. Muito escrito.",
c:"Oposto em ênfase de にすぎない: にほかならない valoriza (é exatamente isso), にすぎない diminui (é só isso).",
x:[["今回の|成功は|皆さんの|努力の|結果に|ほかならない。","こんかいの せいこうは みなさんの どりょくの けっかに ほかならない。","Este sucesso não é senão o resultado do esforço de todos."],
   ["親が|厳しいのは|子どもを|愛しているから|にほかならない。","おやが きびしいのは こどもを あいして いる から に ほかならない。","Os pais são rígidos justamente porque amam os filhos."],
   ["この|問題は|教育の|問題に|ほかならない。","この もんだいは きょういくの もんだいに ほかならない。","Este problema é exatamente um problema de educação."]],
q:[["彼が合格できたのは、毎日の努力の結果＿＿＿。",["にほかならない","にすぎない","に決まっている","とは限らない"],"かれが ごうかく できたのは、まいにちの どりょくの けっかに ほかならない。","Ele passou exatamente por causa do esforço diário.","Afirmação forte e valorizada: にほかならない."],
   ["私がこの仕事を続けるのは、この仕事が好きだから＿＿＿。",["にほかならない","にすぎない","に違いない","ものか"],"わたしが この しごとを つづけるのは、この しごとが すきだ から に ほかならない。","Continuo neste trabalho simplesmente porque gosto dele.","から + にほかならない."],
   ["言葉を学ぶことは、その文化を学ぶこと＿＿＿。",["にほかならない","にすぎない","わけがない","とは限らない"],"ことばを まなぶ ことは、その ぶんかを まなぶ ことに ほかならない。","Aprender uma língua é, afinal, aprender a sua cultura.","にほかならない."]]},

{id:"ja-towakagiranai",u:"n2-17",t:"〜とは限らない",m:"não necessariamente; nem sempre",f:"forma simples + とは限(かぎ)らない (costuma vir com 必ずしも・いつも・誰でも)",
e:"Nega uma generalização: 高い物がいい物とは限らない = o caro nem sempre é bom.",
c:"わけではない também nega parcialmente, mas とは限らない foca em 'há exceções'.",
x:[["高い|物が|いい|物とは|限らない。","たかい ものが いい ものとは かぎらない。","O caro nem sempre é bom."],
   ["日本人が|みんな|敬語を|正しく|使えるとは|限らない。","にほんじんが みんな けいごを ただしく つかえるとは かぎらない。","Nem todo japonês sabe usar keigo corretamente."],
   ["必ずしも|努力が|報われるとは|限らない。","かならずしも どりょくが むくわれるとは かぎらない。","O esforço nem sempre é recompensado."]],
q:[["有名な大学を出た人が、必ずしも仕事ができる＿＿＿。",["とは限らない","に違いない","に決まっている","にほかならない"],"ゆうめいな だいがくを でた ひとが、かならずしも しごとが できるとは かぎらない。","Quem se formou em faculdade famosa não é necessariamente bom no trabalho.","必ずしも + とは限らない."],
   ["天気予報が当たる＿＿＿から、傘を持っていこう。",["とは限らない","に決まっている","にすぎない","に違いない"],"てんきよほうが あたるとは かぎらない から、かさを もって いこう。","A previsão nem sempre acerta, vou levar guarda-chuva.","Pode haver exceção: とは限らない."],
   ["お金持ちが幸せだ＿＿＿限らない。",["とは","には","では","から"],"おかねもちが しあわせだとは かぎらない。","Rico nem sempre é feliz.","forma simples + とは + 限らない."]]},

/* ---------- n2-18 ---------- */
{id:"ja-naikotoniwa",u:"n2-18",t:"〜ないことには",m:"se não (fizer), não dá",f:"V ない / adj い → くない / adj な, S + でない + ことには (+ negativa)",
e:"Condição indispensável: sem A, B não acontece. A segunda parte é negativa: 食べてみないことには、わからない.",
c:"なければ é neutro; ないことには enfatiza que A é obrigatório e vem com resultado negativo.",
x:[["実際に|使って|みないことには、|よさは|わからない。","じっさいに つかって みない ことには、よさは わからない。","Sem usar de verdade, não dá para saber se é bom."],
   ["社長の|許可が|ないことには、|何も|決められない。","しゃちょうの きょかが ない ことには、なにも きめられない。","Sem autorização do presidente, não dá para decidir nada."],
   ["体が|丈夫で|ないことには、|この|仕事は|続けられない。","からだが じょうぶで ない ことには、この しごとは つづけられない。","Sem ter boa saúde, não dá para continuar neste trabalho."]],
q:[["本人に会ってみ＿＿＿、どんな人かわからない。",["ないことには","ることには","たことには","ずことには"],"ほんにんに あって みない ことには、どんな ひとか わからない。","Sem encontrar a pessoa, não dá para saber como ela é.","Condição indispensável: ないことには."],
   ["お金がない＿＿＿、留学はできない。",["ことには","ものには","わけには","ことに"],"おかねが ない ことには、りゅうがくは できない。","Sem dinheiro, não dá para fazer intercâmbio.","ないことには + negativa."],
   ["練習しないことには、上手に＿＿＿。",["ならない","なる","なれる","なった"],"れんしゅう しない ことには、じょうずに ならない。","Sem praticar, não se fica bom.","A segunda parte é negativa."]]},

{id:"ja-tekaradenaito",u:"n2-18",t:"〜てからでないと",m:"só depois de (senão não dá)",f:"V て + からでないと / からでなければ (+ negativa)",
e:"Enquanto A não acontecer, B não é possível: 手を洗ってからでないと、食べてはいけない.",
c:"ないことには foca na condição; てからでないと foca na ordem (primeiro A).",
x:[["料金を|払ってから|でないと、|入場|できません。","りょうきんを はらって から でないと、にゅうじょう できません。","Só é possível entrar depois de pagar."],
   ["全部の|資料を|読んでから|でないと、|判断|できない。","ぜんぶの しりょうを よんで から でないと、はんだん できない。","Só dá para julgar depois de ler todo o material."],
   ["医者に|相談してから|でなければ、|薬は|やめられない。","いしゃに そうだん して から で なければ、くすりは やめられない。","Só posso parar o remédio depois de consultar o médico."]],
q:[["親の許可をもらって＿＿＿、アルバイトはできない。",["からでないと","からには","ばかりか","うえで"],"おやの きょかを もらって から でないと、アルバイトは できない。","Só posso trabalhar meio período depois de ter a autorização dos pais.","Ordem obrigatória: てからでないと."],
   ["実物を見てからでないと、買うかどうか＿＿＿。",["決められない","決める","決めよう","決めた"],"じつぶつを みて から でないと、かうか どうか きめられない。","Só consigo decidir se compro depois de ver o produto.","Segunda parte negativa."],
   ["この仕事が終わって＿＿＿、休みは取れない。",["からでなければ","からこそ","からして","からといって"],"この しごとが おわって から で なければ、やすみは とれない。","Só posso tirar folga depois que este trabalho acabar.","からでなければ = variante."]]},

{id:"ja-mononara",u:"n2-18",t:"〜ものなら",m:"se fosse possível; se ousar (fazer)",f:"V potencial + ものなら (desejo difícil) · V volitivo (〜よう) + ものなら (se ousar, algo ruim vem)",
e:"1) Com potencial, desejo quase impossível: できるものなら、もう一度学生に戻りたい. 2) Com volitivo, alerta: 遅刻しようものなら、怒られる.",
c:"Não serve para condição comum e realista; aí use たら/ば.",
x:[["できる|ものなら、|もう|一度|学生に|戻りたい。","できる ものなら、もう いちど がくせいに もどりたい。","Se fosse possível, queria voltar a ser estudante."],
   ["行ける|ものなら、|今すぐ|日本へ|行きたい。","いける ものなら、いますぐ にほんへ いきたい。","Se pudesse, iria ao Japão agora mesmo."],
   ["あの|先生の|授業に|遅れようものなら、|大変な|ことになる。","あの せんせいの じゅぎょうに おくれよう ものなら、たいへんな ことに なる。","Se você ousar se atrasar para a aula daquele professor, vai dar problema."]],
q:[["やり直せる＿＿＿、あの日に戻りたい。",["ものなら","ものの","ものだから","ものか"],"やりなおせる ものなら、あの ひに もどりたい。","Se desse para refazer, queria voltar àquele dia.","Desejo difícil: potencial + ものなら."],
   ["父の前でそんなことを言おう＿＿＿、ひどく叱られるよ。",["ものなら","ものの","ものだから","ものか"],"ちちの まえで そんな ことを いおう ものなら、ひどく しかられる よ。","Se ousar dizer isso na frente do meu pai, vai levar uma bronca.","Volitivo + ものなら = se ousar."],
   ["休める＿＿＿休みたいが、今は忙しくて無理だ。",["ものなら","からには","ばかりに","ものの"],"やすめる ものなら やすみたいが、いまは いそがしくて むり だ。","Se desse, queria descansar, mas agora estou ocupado demais.","ものなら + desejo."]]},

{id:"ja-saeba",u:"n2-18",t:"〜さえ〜ば",m:"basta (que)... para",f:"S + さえ + V ば / V ます-raiz + さえすれば / V て + さえいれば",
e:"Uma única condição mínima é suficiente: 時間さえあれば、行きたい = basta ter tempo que eu vou.",
c:"さえ sozinho também é 'até': 子どもでさえできる. Com ば, é 'basta'.",
x:[["お金|さえ|あれば、|何でも|買える|わけでは|ない。","おかね さえ あれば、なんでも かえる わけでは ない。","Não é só ter dinheiro que se compra tudo."],
   ["この|薬を|飲みさえ|すれば、|すぐ|治ります。","この くすりを のみさえ すれば、すぐ なおります。","Basta tomar este remédio que sara logo."],
   ["あなたが|元気で|いさえ|すれば、|それで|いい。","あなたが げんきで いさえ すれば、それで いい。","Basta você estar bem, isso já basta."]],
q:[["住所＿＿＿わかれば、地図で探せる。",["さえ","しか","だけに","こそ"],"じゅうしょ さえ わかれば、ちずで さがせる。","Basta saber o endereço que dá para achar no mapa.","さえ + ば = basta."],
   ["このボタンを押し＿＿＿すれば、電源が入ります。",["さえ","ても","ながら","たり"],"この ボタンを おしさえ すれば、でんげんが はいります。","Basta apertar este botão que liga.","ます-raiz + さえすれば."],
   ["天気さえ＿＿＿、明日は山に登る予定だ。",["よければ","よくても","よかったら","いいので"],"てんき さえ よければ、あしたは やまに のぼる よてい だ。","Se o tempo estiver bom, amanhã vamos subir a montanha.","さえ + forma ば: よければ."]]},

{id:"ja-toshitemo",u:"n2-18",t:"〜としても",m:"mesmo que (supondo que)",f:"forma simples + としても",
e:"Hipótese que não muda a conclusão: たとえ反対されたとしても、やるつもりだ.",
c:"ても é o geral; としても deixa claro que é suposição. Costuma vir com たとえ.",
x:[["たとえ|失敗した|としても、|後悔は|しない。","たとえ しっぱい した と しても、こうかいは しない。","Mesmo que eu falhe, não vou me arrepender."],
   ["今から|出発した|としても、|間に合わない|だろう。","いまから しゅっぱつ した と しても、まにあわない だろう。","Mesmo que a gente saia agora, provavelmente não chega a tempo."],
   ["冗談だ|としても、|言っては|いけない|ことが|ある。","じょうだん だと しても、いっては いけない ことが ある。","Mesmo sendo piada, há coisas que não se dizem."]],
q:[["たとえ親に反対された＿＿＿、この仕事を選ぶ。",["としても","からには","ばかりに","ものの"],"たとえ おやに はんたい された と しても、この しごとを えらぶ。","Mesmo que meus pais sejam contra, vou escolher este trabalho.","たとえ + としても."],
   ["宝くじが当たった＿＿＿、仕事は辞めない。",["としても","とすれば","からこそ","だけに"],"たからくじが あたった と しても、しごとは やめない。","Mesmo que eu ganhe na loteria, não largo o emprego.","Suposição que não muda a conclusão: としても."],
   ["今から勉強を始めた＿＿＿、試験には間に合わないだろう。",["としても","ところ","うえで","あまり"],"いまから べんきょうを はじめた と しても、しけんには まにあわない だろう。","Mesmo começando a estudar agora, não dá tempo para a prova.","としても."]]},

/* ---------- n2-19 ---------- */
{id:"ja-karatoitte",u:"n2-19",t:"〜からといって",m:"só porque... não quer dizer que",f:"forma simples + からといって (+ negativa: わけではない・とは限らない・〜ない)",
e:"Nega que uma razão leve automaticamente a uma conclusão: 日本人だからといって、敬語が完璧なわけではない.",
c:"からといって quase sempre vem com uma negação na segunda parte.",
x:[["日本人だから|といって、|敬語が|完璧な|わけでは|ない。","にほんじん だから と いって、けいごが かんぺきな わけでは ない。","Não é porque é japonês que o keigo dele é perfeito."],
   ["安いから|といって、|たくさん|買うのは|よくない。","やすい から と いって、たくさん かうのは よくない。","Não é porque é barato que se deve comprar muito."],
   ["一度|失敗した|からといって、|諦めては|いけない。","いちど しっぱい した から と いって、あきらめては いけない。","Não é porque falhou uma vez que deve desistir."]],
q:[["お金がある＿＿＿、幸せだとは限らない。",["からといって","からこそ","からには","ことから"],"おかねが ある から と いって、しあわせだとは かぎらない。","Não é porque tem dinheiro que é feliz.","からといって + negação parcial."],
   ["忙しい＿＿＿、連絡しなくていいわけではない。",["からといって","あまり","うえに","ばかりか"],"いそがしい から と いって、れんらく しなくて いい わけでは ない。","Estar ocupado não quer dizer que pode deixar de avisar.","からといって + わけではない."],
   ["試験が簡単だったからといって、油断して＿＿＿。",["はいけない","もいい","ばかりだ","ほしい"],"しけんが かんたん だった から と いって、ゆだん しては いけない。","Não é porque a prova foi fácil que se pode relaxar.","Segunda parte negativa."]]},

{id:"ja-towaie",u:"n2-19",t:"〜とはいえ",m:"embora; ainda que (reconhecendo)",f:"forma simples (な/S às vezes sem だ) + とはいえ",
e:"Reconhece um fato, mas diz que a realidade é diferente do que se esperaria: 春とはいえ、まだ寒い.",
c:"けれども é neutro; とはいえ é escrito e enfatiza a expectativa quebrada.",
x:[["春|とはいえ、|まだ|寒い|日が|続いている。","はる とは いえ、まだ さむい ひが つづいて いる。","Embora seja primavera, ainda seguem dias frios."],
   ["仕事|とはいえ、|毎日|残業するのは|つらい。","しごと とは いえ、まいにち ざんぎょう するのは つらい。","Mesmo sendo trabalho, fazer hora extra todo dia é duro."],
   ["わざとでは|ないとはいえ、|迷惑を|かけたのは|事実だ。","わざとでは ない とは いえ、めいわくを かけたのは じじつ だ。","Embora não tenha sido de propósito, o fato é que causei incômodo."]],
q:[["日曜日＿＿＿、店は忙しかった。",["とはいえ","だけに","として","からして"],"にちようび とは いえ、みせは いそがしかった。","Mesmo sendo domingo, a loja estava movimentada.","Reconhece e contrasta: とはいえ."],
   ["ダイエット中＿＿＿、少しぐらいならケーキを食べてもいいだろう。",["とはいえ","からこそ","ばかりか","に限って"],"ダイエットちゅう とは いえ、すこし ぐらい なら ケーキを たべても いい だろう。","Embora esteja de dieta, um pedacinho de bolo deve estar ok.","とはいえ."],
   ["便利になった＿＿＿、この町はまだ不便な点が多い。",["とはいえ","からには","あまり","せいで"],"べんりに なった とは いえ、この まちは まだ ふべんな てんが おおい。","Embora tenha ficado mais prática, esta cidade ainda tem muitos inconvenientes.","Forma simples + とはいえ."]]},

{id:"ja-toittemo",u:"n2-19",t:"〜といっても",m:"embora se diga que; mas na verdade (é pouco)",f:"forma simples (な/S sem だ) + といっても",
e:"Corrige a expectativa para baixo: 料理ができるといっても、簡単な物だけです = digo que sei cozinhar, mas só coisas simples.",
c:"とはいえ contrasta com o esperado; といっても limita o alcance do que foi dito.",
x:[["料理が|できる|といっても、|簡単な|物|だけです。","りょうりが できる と いっても、かんたんな もの だけ です。","Digo que sei cozinhar, mas só coisas simples."],
   ["休み|といっても、|一日|だけだ。","やすみ と いっても、いちにち だけ だ。","Folga, mas é só um dia."],
   ["日本に|住んで|いたといっても、|半年|だけです。","にほんに すんで いた と いっても、はんとし だけ です。","Morei no Japão, mas só seis meses."]],
q:[["旅行＿＿＿、近くの温泉に一泊するだけだ。",["といっても","というより","とはかぎらず","としたら"],"りょこう と いっても、ちかくの おんせんに いっぱく する だけ だ。","Chamo de viagem, mas é só uma noite numa fonte termal perto.","Limitar o alcance: といっても."],
   ["ドイツ語が話せる＿＿＿、あいさつ程度です。",["といっても","からこそ","だけに","ばかりか"],"ドイツごが はなせる と いっても、あいさつ ていど です。","Falo alemão, mas só o básico dos cumprimentos.","といっても + だけ/程度."],
   ["社長＿＿＿、社員三人の小さな会社です。",["といっても","にとって","として","に対して"],"しゃちょう と いっても、しゃいん さんにんの ちいさな かいしゃ です。","Sou presidente, mas é uma empresa pequena de três funcionários.","S + といっても."]]},

{id:"ja-nimokakawarazu",u:"n2-19",t:"〜にもかかわらず",m:"apesar de; mesmo com",f:"forma simples (な/S + である) + にもかかわらず; S + にもかかわらず",
e:"Contraste formal: o esperado não aconteceu. 雨にもかかわらず、多くの人が集まった.",
c:"Não confunda com にかかわらず (independentemente de). のに é a versão falada e emotiva.",
x:[["雨にも|かかわらず、|多くの|人が|集まった。","あめにも かかわらず、おおくの ひとが あつまった。","Apesar da chuva, muita gente se reuniu."],
   ["一生懸命|勉強した|にもかかわらず、|不合格だった。","いっしょうけんめい べんきょう した にも かかわらず、ふごうかく だった。","Apesar de ter estudado muito, reprovei."],
   ["平日で|あるにも|かかわらず、|店は|混んでいた。","へいじつで ある にも かかわらず、みせは こんで いた。","Apesar de ser dia útil, a loja estava cheia."]],
q:[["熱がある＿＿＿、彼は会社に来た。",["にもかかわらず","にかかわらず","を問わず","に限らず"],"ねつが ある にも かかわらず、かれは かいしゃに きた。","Apesar da febre, ele veio trabalhar.","Contraste com o esperado: にもかかわらず."],
   ["年齢＿＿＿、誰でも参加できます。",["にかかわらず","にもかかわらず","にしては","に反して"],"ねんれい に かかわらず、だれでも さんか できます。","Independentemente da idade, qualquer um pode participar.","Aqui é 'independentemente': にかかわらず (sem も)."],
   ["何度も注意した＿＿＿、彼は同じミスを繰り返した。",["にもかかわらず","からといって","ばかりに","わりに"],"なんども ちゅうい した にも かかわらず、かれは おなじ ミスを くりかえした。","Apesar de alertado várias vezes, ele repetiu o mesmo erro.","にもかかわらず."]]},

{id:"ja-tatokorode",u:"n2-19",t:"〜たところで",m:"mesmo que (faça), não adianta",f:"V た + ところで (+ resultado negativo ou inútil)",
e:"Ação que não traria resultado: 今から急いだところで、間に合わない. Tom de resignação.",

x:[["今から|急いだ|ところで、|間に合わない。","いまから いそいだ ところで、まにあわない。","Mesmo correndo agora, não dá tempo."],
   ["いくら|説明した|ところで、|彼は|わかって|くれない。","いくら せつめい した ところで、かれは わかって くれない。","Por mais que eu explique, ele não vai entender."],
   ["謝った|ところで、|許して|もらえない|だろう。","あやまった ところで、ゆるして もらえない だろう。","Mesmo pedindo desculpas, não devo ser perdoado."]],
q:[["今さら後悔した＿＿＿、どうにもならない。",["ところで","ところに","ところを","ところだ"],"いまさら こうかい した ところで、どうにも ならない。","Arrepender-se agora não adianta nada.","Ação inútil: たところで."],
   ["いくら頼んだところで、父は＿＿＿だろう。",["許さない","許す","許してくれる","許してほしい"],"いくら たのんだ ところで、ちちは ゆるさない だろう。","Por mais que eu peça, meu pai não vai permitir.","Segunda parte negativa."],
   ["どんなに急い＿＿＿、最終電車には乗れない。",["だところで","でところで","たところに","だところを"],"どんなに いそいだ ところで、さいしゅう でんしゃには のれない。","Por mais que eu corra, não pego o último trem.","急ぐ → 急いだ + ところで."]]}
]};

   ["いろいろ悩んだ＿＿＿、結局会社を辞めた。",["あげく","ところで","うちに","とたん"],"いろいろ なやんだ あげく、けっきょく かいしゃを やめた。","Depois de muito me angustiar, acabei saindo da empresa.","あげく + 結局."],
   ["口げんか＿＿＿あげく、二人は別れてしまった。",["の","な","だ","に"],"くちげんかの あげく、ふたりは わかれて しまった。","Depois de tanta briga, os dois terminaram.","S + の + あげく."]]},

{id:"ja-sueni",u:"n2-20",t:"〜末(に)",m:"depois de (muito esforço), finalmente",f:"V た / S + の + 末(すえ)(に)",
e:"Resultado depois de um processo longo; pode ser bom ou ruim: よく考えた末に決めた.",
c:"あげく tende ao negativo; 末に é mais neutro e formal.",
x:[["よく|考えた|末に、|留学する|ことに|した。","よく かんがえた すえに、りゅうがく する ことに した。","Depois de pensar bem, decidi fazer intercâmbio."],
   ["3年間の|努力の|末、|ついに|合格した。","さんねんかんの どりょくの すえ、ついに ごうかく した。","Depois de três anos de esforço, finalmente passei."],
   ["話し合いの|末、|計画は|中止に|なった。","はなしあいの すえ、けいかくは ちゅうしに なった。","Depois de muita conversa, o plano foi cancelado."]],
q:[["長い交渉の＿＿＿、契約が成立した。",["末","あげく","うえ","きり"],"ながい こうしょうの すえ、けいやくが せいりつ した。","Depois de longa negociação, o contrato foi fechado.","Resultado bom após processo: 末."],
   ["何度も失敗した＿＿＿、新しい薬が完成した。",["末に","あげく","ところに","たびに"],"なんども しっぱい した すえに、あたらしい くすりが かんせい した。","Depois de várias falhas, o novo remédio ficou pronto.","Resultado positivo: 末に (あげく soaria negativo)."],
   ["悩んだ末、彼女に本当のことを＿＿＿。",["話した","話そう","話している","話せない"],"なやんだ すえ、かのじょに ほんとうの ことを はなした。","Depois de me angustiar, contei a verdade a ela.","末 + ação concluída."]]},

{id:"ja-kiru",u:"n2-20",t:"〜きる / きれない",m:"fazer até o fim / não conseguir (tudo)",f:"V ます-raiz + きる・きれる・きれない",
e:"きる = completar totalmente (食べきる, 使いきる). きれない = não dá para terminar ou é demais (数えきれない). きった = completamente (疲れきった).",
c:"終わる indica fim; きる enfatiza fazer por inteiro, até esgotar.",
x:[["一晩で|小説を|読みきった。","ひとばんで しょうせつを よみきった。","Li o romance inteiro numa noite."],
   ["こんなに|たくさん、|一人では|食べきれない。","こんなに たくさん、ひとりでは たべきれない。","Tanta comida assim, sozinho não consigo comer tudo."],
   ["彼は|疲れきった|顔を|していた。","かれは つかれきった かおを して いた。","Ele estava com cara de completamente exausto."]],
q:[["空には数え＿＿＿ほどの星が出ていた。",["きれない","きった","ぬいた","かけた"],"そらには かぞえきれない ほどの ほしが でて いた。","Havia estrelas demais no céu para contar.","Não dá para completar: きれない."],
   ["マラソンを最後まで走り＿＿＿。",["きった","かけた","がちだ","っぽい"],"マラソンを さいごまで はしりきった。","Corri a maratona até o fim.","Completar totalmente: きる."],
   ["その話は、もうわかり＿＿＿ことだ。",["きった","きれない","かけた","ぬく"],"その はなしは、もう わかりきった ことだ。","Isso já é mais do que sabido.","わかりきった = completamente óbvio."]]},

{id:"ja-nuku",u:"n2-20",t:"〜ぬく",m:"fazer até o fim, apesar das dificuldades",f:"V ます-raiz + ぬく",
e:"Levar algo até o fim com esforço, superando obstáculos: 最後まで戦いぬく, 考えぬいた末に.",
c:"きる é completar; ぬく acrescenta esforço e perseverança.",
x:[["彼は|最後まで|走りぬいた。","かれは さいごまで はしりぬいた。","Ele correu até o fim, sem desistir."],
   ["考え|ぬいた|末に、|転職を|決めた。","かんがえ ぬいた すえに、てんしょくを きめた。","Depois de pensar exaustivamente, decidi mudar de emprego."],
   ["苦しい|時代を|生きぬいた|人々。","くるしい じだいを いきぬいた ひとびと。","Pessoas que sobreviveram a tempos difíceis."]],
q:[["どんなにつらくても、この仕事をやり＿＿＿つもりだ。",["ぬく","かける","がち","っぽい"],"どんなに つらくても、この しごとを やりぬく つもり だ。","Por mais difícil que seja, pretendo levar este trabalho até o fim.","Até o fim com esforço: ぬく."],
   ["選手たちは最後まで戦い＿＿＿。",["ぬいた","かけた","きれなかった","がちだった"],"せんしゅたちは さいごまで たたかいぬいた。","Os atletas lutaram até o fim.","戦いぬく."],
   ["悩み＿＿＿結論なので、変えるつもりはない。",["ぬいた","かけた","っぱなしの","ぎみの"],"なやみぬいた けつろん なので、かえる つもりは ない。","É uma conclusão pensada à exaustão, não pretendo mudá-la.","悩みぬいた = depois de muita reflexão."]]},

{id:"ja-kake",u:"n2-20",t:"〜かけ / かける",m:"começado e não terminado; quase",f:"V ます-raiz + かけ(の + S) / かける / かけた",
e:"Ação começada e interrompida: 食べかけのパン, 読みかけの本. かける também é 'estar prestes a': 死にかけた.",
c:"途中 é neutro; かけ mostra o objeto que ficou pela metade.",
x:[["机の|上に|読みかけの|本が|ある。","つくえの うえに よみかけの ほんが ある。","Tem um livro pela metade em cima da mesa."],
   ["何か|言いかけて、|彼は|黙った。","なにか いいかけて、かれは だまった。","Ele começou a dizer algo e ficou calado."],
   ["事故で|死にかけた|ことが|ある。","じこで しにかけた ことが ある。","Já quase morri num acidente."]],
q:[["食べ＿＿＿のケーキを冷蔵庫に入れておいた。",["かけ","きり","ぬき","がち"],"たべかけの ケーキを れいぞうこに いれて おいた。","Guardei na geladeira o bolo comido pela metade.","Pela metade: かけ."],
   ["やり＿＿＿仕事を放っておかないで。",["かけの","きった","ぬいた","っぽい"],"やりかけの しごとを ほうって おかないで。","Não deixe o trabalho começado largado.","かけの + substantivo."],
   ["花が枯れ＿＿＿いるので、水をあげた。",["かけて","きって","ぬいて","がちで"],"はなが かれかけて いる ので、みずを あげた。","A flor estava começando a murchar, então reguei.","Prestes/começando: かける."]]},

/* ---------- n2-21 ---------- */
{id:"ja-katoomouto",u:"n2-21",t:"〜かと思うと / かと思ったら",m:"mal (aconteceu), já (outra coisa)",f:"V た + かと思うと・かと思ったら",
e:"Duas coisas contrastantes em sequência muito rápida, observadas por quem fala: 泣いたかと思うと、もう笑っている.",
c:"Não se usa para a própria ação de quem fala. たとたん é parecido, mas かと思うと enfatiza a surpresa com o contraste.",
x:[["赤ちゃんは|泣いたかと|思うと、|もう|笑っている。","あかちゃんは ないたかと おもうと、もう わらって いる。","Mal o bebê chorou, já está rindo."],
   ["空が|暗く|なったかと|思ったら、|雨が|降り出した。","そらが くらく なったかと おもったら、あめが ふりだした。","Mal o céu escureceu, já começou a chover."],
   ["弟は|帰って|きたかと|思うと、|すぐ|出かけた。","おとうとは かえって きたかと おもうと、すぐ でかけた。","Meu irmão mal chegou e já saiu de novo."]],
q:[["彼女は部屋に入ってきた＿＿＿、すぐに出ていった。",["かと思うと","ばかりに","ところで","あげく"],"かのじょは へやに はいって きたかと おもうと、すぐに でて いった。","Ela mal entrou no quarto e já saiu.","Sequência rápida e contrastante: かと思うと."],
   ["晴れたかと思ったら、また雨が＿＿＿。",["降ってきた","降ろう","降りたい","降るつもりだ"],"はれたかと おもったら、また あめが ふって きた。","Mal o tempo abriu, voltou a chover.","Fato observado (não intenção)."],
   ["授業が終わった＿＿＿、生徒たちはもう校庭で遊んでいた。",["かと思うと","ついでに","末に","上で"],"じゅぎょうが おわったかと おもうと、せいとたちは もう こうていで あそんで いた。","Mal a aula acabou, os alunos já estavam brincando no pátio.","Descreve outra pessoa, sequência rápida: かと思うと (não serve para a própria intenção)."]]},

{id:"ja-kanaika",u:"n2-21",t:"〜か〜ないかのうちに",m:"mal (nem terminou) e já",f:"V dicionário / V た + か + V ない + かのうちに",
e:"A segunda coisa acontece quase ao mesmo tempo que a primeira, antes mesmo de terminar: ベルが鳴るか鳴らないかのうちに.",
c:"Repete o mesmo verbo na afirmativa e na negativa.",
x:[["ベルが|鳴るか|鳴らないかの|うちに、|生徒たちは|教室を|飛び出した。","ベルが なるか ならないかの うちに、せいとたちは きょうしつを とびだした。","Mal o sinal tocou, os alunos saíram correndo da sala."],
   ["彼は|横に|なるか|ならないかの|うちに、|寝て|しまった。","かれは よこに なるか ならないかの うちに、ねて しまった。","Mal se deitou, ele já dormiu."],
   ["電車が|止まったか|止まらないかの|うちに、|ドアが|開いた。","でんしゃが とまったか とまらないかの うちに、ドアが あいた。","Mal o trem parou, a porta abriu."]],
q:[["映画が終わる＿＿＿、彼は席を立った。",["か終わらないかのうちに","とともに","ついでに","末に"],"えいがが おわるか おわらないかの うちに、かれは せきを たった。","Mal o filme acabou, ele se levantou.","Quase simultâneo: か〜ないかのうちに."],
   ["目覚ましが鳴るか鳴らない＿＿＿、止めた。",["かのうちに","ものの","あまり","うえに"],"めざましが なるか ならないかの うちに、とめた。","Mal o despertador tocou, desliguei.","〜ないかのうちに."],
   ["雨が降り出したか降り出さないかのうちに、みんな＿＿＿。",["走り出した","走り出そう","走りたい","走ってください"],"あめが ふりだしたか ふりださないかの うちに、みんな はしりだした。","Mal começou a chover, todos saíram correndo.","Fato observado no passado."]]},

{id:"ja-teirai",u:"n2-21",t:"〜て以来",m:"desde que (e continua até hoje)",f:"V て + 以来(いらい); S + 以来",
e:"Desde um ponto no passado, um estado continua: 日本に来て以来、ずっと東京に住んでいる.",
c:"てから é neutro; て以来 enfatiza o estado contínuo desde então. Não use para algo recente como 昨日.",
x:[["日本に|来て|以来、|ずっと|東京に|住んでいる。","にほんに きて いらい、ずっと とうきょうに すんで いる。","Desde que vim ao Japão, moro em Tóquio."],
   ["卒業して|以来、|彼には|一度も|会っていない。","そつぎょう して いらい、かれには いちども あって いない。","Desde a formatura, nunca mais o vi."],
   ["入社|以来、|毎日|早く|来ている。","にゅうしゃ いらい、まいにち はやく きて いる。","Desde que entrei na empresa, chego cedo todo dia."]],
q:[["引っ越して＿＿＿、近所の人と話したことがない。",["以来","以上","以外","以前"],"ひっこして いらい、きんじょの ひとと はなした ことが ない。","Desde que me mudei, nunca conversei com os vizinhos.","Desde então: て以来."],
   ["あの事故＿＿＿、車に乗るのが怖くなった。",["以来","次第","最中","際"],"あの じこ いらい、くるまに のるのが こわく なった。","Desde aquele acidente, passei a ter medo de andar de carro.","S + 以来."],
   ["ヨガを始めて以来、体の調子が＿＿＿。",["いい","よくなるつもりだ","よくしよう","よくなりたい"],"ヨガを はじめて いらい、からだの ちょうしが いい。","Desde que comecei a ioga, estou bem de saúde.","Estado contínuo até hoje."]]},

{id:"ja-uede",u:"n2-21",t:"〜上で",m:"depois de (fazer A, então B); ao fazer",f:"V た / S + の + 上(うえ)で (depois de); V dicionário + 上で (no processo de)",
e:"1) Faça A primeiro, com base nisso faça B: よく確認した上で、サインしてください. 2) No processo de: 日本語を学ぶ上で大切なこと.",
c:"上に = além de (outra estrutura). てから é neutro; た上で destaca que A é base para B.",
x:[["よく|確認した|上で、|サインして|ください。","よく かくにん した うえで、サイン して ください。","Assine depois de conferir bem."],
   ["家族と|相談の|上で、|お返事|します。","かぞくと そうだんの うえで、おへんじ します。","Respondo depois de conversar com a família."],
   ["外国語を|学ぶ|上で、|大切なのは|続ける|ことだ。","がいこくごを まなぶ うえで、たいせつなのは つづける ことだ。","Ao aprender uma língua estrangeira, o importante é continuar."]],
q:[["内容をよく読んだ＿＿＿、契約してください。",["上で","上に","うちに","ついでに"],"ないようを よく よんだ うえで、けいやく して ください。","Faça o contrato depois de ler bem o conteúdo.","Base para a próxima ação: た上で."],
   ["面接の結果は、検討の＿＿＿ご連絡します。",["上","末","際","中"],"めんせつの けっかは、けんとうの うえ ごれんらく します。","Informaremos o resultado da entrevista após análise.","S + の + 上."],
   ["仕事をする＿＿＿、一番大切なのは信頼だ。",["上で","上に","ついでに","あげく"],"しごとを する うえで、いちばん たいせつなのは しんらい だ。","Ao trabalhar, o mais importante é a confiança.","No processo de: V dicionário + 上で."]]},

{id:"ja-tsuideni",u:"n2-21",t:"〜ついでに",m:"aproveitando que; de passagem",f:"V dicionário / V た / S + の + ついでに",
e:"Aproveita uma ação principal para fazer outra junto: 買い物のついでに、郵便局に寄った.",
c:"がてら é parecido e mais escrito (散歩がてら).",
x:[["買い物の|ついでに、|郵便局に|寄った。","かいものの ついでに、ゆうびんきょくに よった。","Aproveitando as compras, passei no correio."],
   ["駅に|行く|ついでに、|この|手紙を|出して|くれる？","えきに いく ついでに、この てがみを だして くれる？","Já que vai à estação, pode colocar esta carta no correio?"],
   ["東京に|出張した|ついでに、|友達に|会った。","とうきょうに しゅっちょう した ついでに、ともだちに あった。","Aproveitando a viagem a Tóquio, encontrei um amigo."]],
q:[["散歩の＿＿＿、パンを買ってきた。",["ついでに","うちに","くせに","とたんに"],"さんぽの ついでに、パンを かって きた。","Aproveitando a caminhada, comprei pão.","Aproveitar a ação principal: ついでに."],
   ["コンビニに行く＿＿＿、牛乳も買ってきて。",["ついでに","ばかりに","わりに","上に"],"コンビニに いく ついでに、ぎゅうにゅうも かって きて。","Já que vai à loja de conveniência, traga leite também.","V dicionário + ついでに."],
   ["部屋を掃除した＿＿＿、いらない服も捨てた。",["ついでに","あまり","以上","ものの"],"へやを そうじ した ついでに、いらない ふくも すてた。","Aproveitando a limpeza do quarto, joguei fora roupas que não uso.","V た + ついでに."]]},

/* ---------- n2-22 ---------- */
{id:"ja-wamochiron",u:"n2-22",t:"〜はもちろん / はもとより",m:"sem falar de; claro que (e também)",f:"S + はもちろん / はもとより + S も",
e:"O primeiro elemento é óbvio, e o segundo também vale: 平日はもちろん、週末も働いている. もとより é mais formal.",
c:"だけでなく é neutro; はもちろん marca o primeiro como evidente.",
x:[["平日は|もちろん、|週末も|働いている。","へいじつは もちろん、しゅうまつも はたらいて いる。","Trabalho nos dias úteis, claro, e também no fim de semana."],
   ["この|店は|味は|もちろん、|サービスも|いい。","この みせは あじは もちろん、サービスも いい。","Neste restaurante o sabor é ótimo, claro, e o serviço também."],
   ["この|歌は|国内は|もとより、|海外でも|人気だ。","この うたは こくないは もとより、かいがいでも にんき だ。","Esta música faz sucesso no país, claro, e também no exterior."]],
q:[["彼は英語＿＿＿、中国語も話せる。",["はもちろん","にかかわらず","に対して","について"],"かれは えいご は もちろん、ちゅうごくごも はなせる。","Ele fala inglês, claro, e também chinês.","Óbvio + também: はもちろん."],
   ["この公園は子ども＿＿＿、大人も楽しめる。",["はもとより","に比べて","に限って","に反して"],"この こうえんは こども は もとより、おとなも たのしめる。","Este parque diverte crianças, claro, e também adultos.","Formal: はもとより."],
   ["旅行では、パスポート＿＿＿、お金も忘れないように。",["はもちろん","を除いて","はともかく","抜きで"],"りょこうでは、パスポート は もちろん、おかねも わすれない ように。","Na viagem, não esqueça o passaporte, claro, nem o dinheiro.","はもちろん + も."]]},

{id:"ja-nominarazu",u:"n2-22",t:"〜のみならず",m:"não só... mas também (formal)",f:"forma simples (な/S + である) / S + のみならず",
e:"Versão escrita de だけでなく: 日本のみならず、世界中で.",
c:"ばかりか traz surpresa; のみならず é neutro e formal.",
x:[["この|問題は|日本のみ|ならず、|世界中で|起きている。","この もんだいは にほんのみ ならず、せかいじゅうで おきて いる。","Este problema ocorre não só no Japão, mas no mundo todo."],
   ["彼は|歌手で|あるのみ|ならず、|俳優としても|活躍している。","かれは かしゅで ある のみ ならず、はいゆう としても かつやく して いる。","Ele não só é cantor como também atua como ator."],
   ["この|薬は|大人のみ|ならず、|子どもにも|使える。","この くすりは おとなのみ ならず、こどもにも つかえる。","Este remédio pode ser usado não só por adultos, mas também por crianças."]],
q:[["環境問題は一つの国＿＿＿、地球全体の問題だ。",["のみならず","にしては","に限って","を問わず"],"かんきょう もんだいは ひとつの くに のみ ならず、ちきゅう ぜんたいの もんだい だ。","O problema ambiental não é só de um país, é do planeta todo.","Formal: のみならず."],
   ["彼女は頭がいい＿＿＿、性格もいい。",["のみならず","からには","ものの","どころか"],"かのじょは あたまが いい のみ ならず、せいかくも いい。","Ela não só é inteligente como também tem bom caráter.","い-adj + のみならず."],
   ["この法律は国民の生活＿＿＿、経済にも大きな影響を与える。",["のみならず","につき","にわたって","をもとに"],"この ほうりつは こくみんの せいかつ のみ ならず、けいざいにも おおきな えいきょうを あたえる。","Esta lei afeta não só a vida da população, mas também a economia.","S + のみならず + にも."]]},

{id:"ja-watomokaku",u:"n2-22",t:"〜はともかく",m:"deixando de lado; seja como for",f:"S + はともかく(として)",
e:"Deixa um ponto de lado para focar no mais importante: 味はともかく、値段が安い.",
c:"はもちろん inclui o primeiro; はともかく o põe de lado.",
x:[["味は|ともかく、|この|店は|安い。","あじは ともかく、この みせは やすい。","O sabor à parte, este restaurante é barato."],
   ["結果は|ともかく、|最後まで|頑張った|ことが|大切だ。","けっかは ともかく、さいごまで がんばった ことが たいせつ だ。","Seja qual for o resultado, o importante é ter se esforçado até o fim."],
   ["冗談は|ともかくとして、|本題に|入りましょう。","じょうだんは ともかく と して、ほんだいに はいりましょう。","Brincadeiras à parte, vamos ao assunto."]],
q:[["見た目＿＿＿、このケーキはおいしい。",["はともかく","はもちろん","のみならず","に限らず"],"みため は ともかく、この ケーキは おいしい。","A aparência à parte, este bolo é gostoso.","Deixar de lado: はともかく."],
   ["勝ち負け＿＿＿、楽しむことが大事だ。",["はともかく","を中心に","にこたえて","のもとで"],"かちまけ は ともかく、たのしむ ことが だいじ だ。","Ganhar ou perder à parte, o importante é se divertir.","はともかく."],
   ["値段はともかく＿＿＿、品質をもっと調べよう。",["として","にして","について","によって"],"ねだんは ともかく と して、ひんしつを もっと しらべよう。","Deixando o preço de lado, vamos pesquisar mais a qualidade.","はともかくとして."]]},

{id:"ja-wonozoite",u:"n2-22",t:"〜を除いて",m:"exceto; com exceção de",f:"S + を除(のぞ)いて / を除き / を除く + S",
e:"Exclui um elemento: 日曜日を除いて、毎日営業しています. Estilo formal de 以外.",
c:"以外 é o comum; を除いて aparece em avisos, regras e textos formais.",
x:[["日曜日を|除いて、|毎日|営業しています。","にちようびを のぞいて、まいにち えいぎょう して います。","Funcionamos todos os dias, exceto domingo."],
   ["一部を|除き、|ほとんどの|店が|閉まっていた。","いちぶを のぞき、ほとんどの みせが しまって いた。","Com exceção de algumas, quase todas as lojas estavam fechadas."],
   ["彼を|除く|全員が|賛成した。","かれを のぞく ぜんいんが さんせい した。","Todos, exceto ele, concordaram."]],
q:[["祝日＿＿＿、午前9時から開いています。",["を除いて","をはじめ","を通じて","をめぐって"],"しゅくじつ を のぞいて、ごぜん くじから あいて います。","Exceto feriados, abrimos a partir das 9h.","Exceção formal: を除いて."],
   ["一人＿＿＿、全員が試験に合格した。",["を除き","のみならず","はもちろん","に伴い"],"ひとり を のぞき、ぜんいんが しけんに ごうかく した。","Com exceção de uma pessoa, todos passaram na prova.","Forma escrita: を除き."],
   ["この店は年末年始＿＿＿、一年中営業している。",["を除いて","をはじめ","を中心に","のもとで"],"この みせは ねんまつねんし を のぞいて、いちねんじゅう えいぎょう して いる。","Esta loja abre o ano todo, exceto no fim e início de ano.","Exceção: を除いて."]]},

{id:"ja-nukide",u:"n2-22",t:"〜抜きで / 抜きにして",m:"sem (algo que normalmente teria)",f:"S + 抜(ぬ)きで / 抜きに / 抜きの + S / 抜きにして(は)",
e:"Sem o elemento que costuma estar incluído: 朝ご飯抜きで出かけた. 抜きにしては語れない = não dá para falar sem mencionar.",
c:"なしで é mais neutro; 抜きで sugere que algo esperado foi retirado.",
x:[["今朝は|朝ご飯|抜きで|会社に|来た。","けさは あさごはん ぬきで かいしゃに きた。","Hoje vim trabalhar sem tomar café da manhã."],
   ["冗談|抜きで、|本当に|困っているんだ。","じょうだん ぬきで、ほんとうに こまって いるんだ。","Sem brincadeira, estou realmente em apuros."],
   ["この|町の|歴史は|お寺を|抜きにしては|語れない。","この まちの れきしは おてらを ぬきに しては かたれない。","Não dá para contar a história desta cidade sem falar do templo."]],
q:[["わさび＿＿＿のお寿司をください。",["抜き","除き","以外","ぬけ"],"わさび ぬきの おすしを ください。","Sushi sem wasabi, por favor.","Sem o que normalmente vem: 抜き."],
   ["堅い話は＿＿＿、楽しく飲みましょう。",["抜きにして","除いて","もちろん","ともかく"],"かたい はなしは ぬきに して、たのしく のみましょう。","Deixemos os assuntos sérios de fora e vamos beber com alegria.","抜きにして."],
   ["彼の協力を抜きにしては、この計画は＿＿＿。",["成功しなかった","成功した","成功しよう","成功したい"],"かれの きょうりょくを ぬきに しては、この けいかくは せいこう しなかった。","Sem a colaboração dele, este plano não teria dado certo.","抜きにしては + negativa."]]},

/* ---------- n2-23 ---------- */
{id:"ja-buri",u:"n2-23",t:"〜ぶり",m:"depois de (tanto tempo); jeito de",f:"período + ぶり(に) · S / V ます-raiz + ぶり",
e:"1) Primeira vez depois de um período: 3年ぶりに会った. 2) Maneira de fazer: 彼の仕事ぶり, 話しぶり.",
c:"久しぶり é a expressão fixa mais usada. 〜ぶり de tempo exige um período (日・年・か月).",
x:[["3年|ぶりに|故郷に|帰った。","さんねん ぶりに こきょうに かえった。","Voltei à minha terra natal depois de três anos."],
   ["彼の|仕事ぶりは|みんなに|評価されている。","かれの しごとぶりは みんなに ひょうか されて いる。","O jeito dele de trabalhar é elogiado por todos."],
   ["久し|ぶりに|映画館で|映画を|見た。","ひさし ぶりに えいがかんで えいがを みた。","Fui ao cinema depois de muito tempo."]],
q:[["10年＿＿＿に高校の友達に会った。",["ぶり","ごと","おき","たび"],"じゅうねん ぶりに こうこうの ともだちに あった。","Revi amigos do colégio depois de dez anos.","Depois de um período: ぶり."],
   ["あの子の食べっ＿＿＿は見ていて気持ちがいい。",["ぷり","ぶり","ごと","ほど"],"あの この たべっぷりは みていて きもちが いい。","Dá gosto de ver aquela criança comer.","Jeito de fazer: 食べっぷり (forma com っぷ)."],
   ["雨は一週間＿＿＿にやんだ。",["ぶり","あたり","ずつ","ごとに"],"あめは いっしゅうかん ぶりに やんだ。","A chuva parou depois de uma semana.","período + ぶりに."]]},

{id:"ja-darake",u:"n2-23",t:"〜だらけ",m:"cheio de (algo ruim)",f:"S + だらけ(の + S / だ)",
e:"Coberto ou cheio de algo indesejado: 間違いだらけ, 泥だらけ, 傷だらけ.",
c:"いっぱい é neutro; だらけ é negativo. まみれ é para líquidos/sujeira grudada (汗まみれ).",
x:[["この|作文は|間違い|だらけだ。","この さくぶんは まちがい だらけ だ。","Esta redação está cheia de erros."],
   ["子どもたちは|泥|だらけに|なって|遊んだ。","こどもたちは どろ だらけに なって あそんだ。","As crianças brincaram e ficaram cobertas de lama."],
   ["部屋が|ごみ|だらけで|座る|場所も|ない。","へやが ごみ だらけで すわる ばしょも ない。","O quarto está cheio de lixo, não tem nem onde sentar."]],
q:[["雨の中で転んで、服が泥＿＿＿になった。",["だらけ","ばかり","ほど","ぶり"],"あめの なかで ころんで、ふくが どろ だらけに なった。","Caí na chuva e a roupa ficou coberta de lama.","Coberto de algo ruim: だらけ."],
   ["このレポートは誤字＿＿＿で、読みにくい。",["だらけ","ぎみ","がち","っぽさ"],"この レポートは ごじ だらけで、よみにくい。","Este relatório está cheio de erros de digitação, difícil de ler.","だらけ."],
   ["借金＿＿＿の生活から抜け出したい。",["だらけ","ぬき","ついで","まま"],"しゃっきん だらけの せいかつから ぬけだしたい。","Quero sair de uma vida cheia de dívidas.","だらけ + の + S."]]},

{id:"ja-kanoyouda",u:"n2-23",t:"〜かのようだ",m:"como se (fosse, mas não é)",f:"forma simples (な/S + である) + かのようだ / かのような + S / かのように + V",
e:"Comparação com algo que não é verdade: まるで夢であるかのようだ. Muito usado com まるで.",
c:"ようだ pode ser dedução; かのようだ deixa claro que é só aparência (não é real).",
x:[["まるで|夏が|来たかの|ような|暑さだ。","まるで なつが きたかの ような あつさ だ。","Um calor como se o verão tivesse chegado."],
   ["彼は|何も|知らないかの|ように|振る舞った。","かれは なにも しらないかの ように ふるまった。","Ele agiu como se não soubesse de nada."],
   ["その|絵は|本物で|あるかの|ように|見える。","その えは ほんもので あるかの ように みえる。","Aquele quadro parece de verdade."]],
q:[["彼女はまるで自分が社長である＿＿＿話す。",["かのように","ばかりに","ついでに","どころか"],"かのじょは まるで じぶんが しゃちょうで あるかの ように はなす。","Ela fala como se fosse a presidente.","Como se (não é): かのように."],
   ["今日は4月なのに、冬に戻った＿＿＿寒さだ。",["かのような","かのように","らしい","っぽい"],"きょうは しがつ なのに、ふゆに もどったかの ような さむさ だ。","É abril, mas faz um frio como se tivesse voltado o inverno.","Antes de substantivo: かのような."],
   ["彼は何事もなかった＿＿＿、笑っていた。",["かのように","からには","ものの","にしても"],"かれは なにごとも なかったかの ように、わらって いた。","Ele ria como se nada tivesse acontecido.","かのように + ação."]]},

{id:"ja-kke",u:"n2-23",t:"〜っけ",m:"mesmo? (confirmar algo esquecido)",f:"forma simples (passado comum: だった・た) + っけ; です/ます + っけ",
e:"Pergunta a si mesmo ou ao outro para lembrar algo: 会議は何時だっけ？ Falado.",
c:"Só na fala informal. Em situação formal: 何時でしたっけ？ ainda soa casual; melhor 何時でしたか.",
x:[["会議は|何時|だっけ？","かいぎは なんじ だっけ？","A reunião é a que horas mesmo?"],
   ["あの|人の|名前、|何て|言ったっけ？","あの ひとの なまえ、なんて いったっけ？","Como é mesmo o nome daquela pessoa?"],
   ["子どもの|頃、|よく|この|公園で|遊んだっけ。","こどもの ころ、よく この こうえんで あそんだっけ。","Quando criança, eu brincava muito neste parque, né."]],
q:[["あれ、今日って何曜日だった＿＿＿？",["っけ","っこ","っぽい","っぱなし"],"あれ、きょうって なんようび だったっけ？","Ué, hoje é que dia da semana mesmo?","Confirmar algo esquecido: っけ."],
   ["この道、前にも通った＿＿＿？",["っけ","らしい","そう","がち"],"この みち、まえにも とおったっけ？","A gente já passou por esta rua antes?","V た + っけ."],
   ["田中さんの誕生日はいつでした＿＿＿。",["っけ","ってば","っこない","っぱなし"],"たなかさんの たんじょうびは いつ でしたっけ。","Quando era mesmo o aniversário do Tanaka?","でした + っけ."]]},

{id:"ja-mai",u:"n2-23",t:"〜まい",m:"não vou (decisão) / provavelmente não",f:"V dicionário + まい (grupo 2 e irregulares também: 食べまい/食べるまい, するまい/すまい, 来るまい/こまい)",
e:"1) Decisão negativa firme: 二度と行くまい. 2) Suposição negativa: 雨は降るまい. Estilo escrito. 〜まいか = será que não...",
c:"ないつもりだ é o falado para decisão; ないだろう para suposição.",
x:[["あんな|店には|二度と|行くまい。","あんな みせには にどと いくまい。","Naquele restaurante nunca mais vou."],
   ["この|空なら、|雨は|降るまい。","この そらなら、あめは ふるまい。","Com um céu desses, não deve chover."],
   ["同じ|失敗は|繰り返すまいと|心に|決めた。","おなじ しっぱいは くりかえすまいと こころに きめた。","Decidi firmemente não repetir o mesmo erro."]],
q:[["もう二度とうそはつく＿＿＿と決めた。",["まい","ない","ず","ぬ"],"もう にどと うそは つくまいと きめた。","Decidi nunca mais mentir.","Decisão negativa firme: まい."],
   ["彼はまだ若いから、そんなことは知る＿＿＿。",["まい","べき","はず","らしい"],"かれは まだ わかい から、そんな ことは しるまい。","Ele ainda é jovem, provavelmente não sabe disso.","Suposição negativa: まい."],
   ["こんな簡単な問題、間違える人はいる＿＿＿。",["まい","まいか","べきだ","ものだ"],"こんな かんたんな もんだい、まちがえる ひとは いるまい。","Um problema tão fácil, ninguém deve errar.","Suposição negativa formal."]]},

/* ---------- n2-24 ---------- */
{id:"ja-bekida",u:"n2-24",t:"〜べきだ / べきではない",m:"deve / não deve (dever moral)",f:"V dicionário + べきだ (する → すべき/するべき) / べきではない",
e:"O que é certo fazer, segundo a opinião de quem fala: 約束は守るべきだ. Mais forte que ほうがいい.",
c:"はずだ é expectativa; べきだ é dever. Não use para regras legais objetivas (aí なければならない).",
x:[["約束は|守る|べきだ。","やくそくは まもる べき だ。","Promessas devem ser cumpridas."],
   ["人の|悪口を|言う|べきでは|ない。","ひとの わるぐちを いう べき では ない。","Não se deve falar mal dos outros."],
   ["もっと|早く|相談す|べきだった。","もっと はやく そうだん す べき だった。","Eu devia ter pedido conselho antes."]],
q:[["学生は勉強する＿＿＿だ。",["べき","はず","わけ","もの"],"がくせいは べんきょう する べき だ。","Estudante deve estudar.","Dever moral: べきだ."],
   ["他人のプライバシーを侵す＿＿＿ではない。",["べき","はず","こと","わけ"],"たにんの プライバシーを おかす べき では ない。","Não se deve invadir a privacidade alheia.","べきではない."],
   ["あのとき、本当のことを言う＿＿＿だった。",["べき","はず","ほど","まい"],"あの とき、ほんとうの ことを いう べき だった。","Naquela hora eu devia ter falado a verdade.","Arrependimento: べきだった."]]},

{id:"ja-toiumonoda",u:"n2-24",t:"〜というものだ",m:"é isso que se chama; é natural que",f:"forma simples (な/S sem だ às vezes) + というものだ",
e:"Conclusão de senso comum ou crítica em tom de verdade geral: 人の手紙を読むのはマナー違反というものだ.",
c:"ものだ fala de natureza/nostalgia; というものだ julga uma situação concreta como 'é isso que é'.",
x:[["人の|手紙を|勝手に|読むのは、|失礼|というものだ。","ひとの てがみを かってに よむのは、しつれい と いう もの だ。","Ler a carta dos outros sem permissão é, isso sim, falta de educação."],
   ["一週間で|日本語を|覚えるのは|無理|というものだ。","いっしゅうかんで にほんごを おぼえるのは むり と いう もの だ。","Aprender japonês em uma semana é simplesmente impossível."],
   ["困っている|人を|助けるのが|友達|というものだ。","こまって いる ひとを たすけるのが ともだち と いう もの だ。","Ajudar quem está em apuros: é isso que é ser amigo."]],
q:[["こんなに努力したんだから、合格して当然＿＿＿。",["というものだ","というものではない","にすぎない","とは限らない"],"こんなに どりょく した んだ から、ごうかく して とうぜん と いう もの だ。","Com tanto esforço, é natural que passe.","Conclusão de senso comum: というものだ."],
   ["借りた物を返さないのは、無責任＿＿＿。",["というものだ","というより","といっても","とはいえ"],"かりた ものを かえさないのは、むせきにん と いう もの だ。","Não devolver o que pegou emprestado é, isso sim, irresponsável.","Julgamento: というものだ."],
   ["苦しいときに支え合うのが家族＿＿＿。",["というものだ","にすぎない","ものか","わけではない"],"くるしい ときに ささえあうのが かぞく と いう もの だ。","Apoiar-se nos momentos difíceis: é isso que é família.","S + というものだ."]]},

{id:"ja-toiumonodewanai",u:"n2-24",t:"〜というものではない",m:"não é (necessariamente) assim que",f:"forma simples + というものではない / というものでもない",
e:"Nega uma ideia simplista: 高ければいいというものではない = não é que quanto mais caro melhor.",
c:"Muito usado com 〜ばいい / 〜さえすればいい: 勉強さえすればいいというものではない.",
x:[["値段が|高ければ|いい|というものでは|ない。","ねだんが たかければ いい と いう もの では ない。","Não é que, se for caro, seja bom."],
   ["長く|働けば|いい|というものでは|ない。","ながく はたらけば いい と いう もの では ない。","Não basta trabalhar muitas horas."],
   ["謝れば|済む|というものでは|ない。","あやまれば すむ と いう もの では ない。","Não é só pedir desculpas que está resolvido."]],
q:[["薬はたくさん飲めば治る＿＿＿。",["というものではない","というものだ","に決まっている","に違いない"],"くすりは たくさん のめば なおる と いう もの では ない。","Não é tomando muito remédio que se sara.","Nega ideia simplista: というものではない."],
   ["お金さえあれば幸せになれる＿＿＿。",["というものでもない","というものだ","にほかならない","ものがある"],"おかね さえ あれば しあわせに なれる と いう もの でも ない。","Não é só ter dinheiro que se fica feliz.","というものでもない (variante mais suave)."],
   ["練習は時間が長ければいい＿＿＿ではない。",["というもの","ということ","というわけ","というはず"],"れんしゅうは じかんが ながければ いい と いう もの では ない。","Treino não é bom só por ser longo.","というもの + ではない."]]},

{id:"ja-nikoshitakotowanai",u:"n2-24",t:"〜に越したことはない",m:"o ideal é; nada melhor que",f:"V dicionário / adj い / adj な, S (sem だ) + に越(こ)したことはない",
e:"Algo é obviamente o melhor, embora não obrigatório: 安いに越したことはない = o ideal é que seja barato.",
c:"方がいい é conselho direto; に越したことはない diz que é o preferível, com certa naturalidade.",
x:[["お金は|あるに|越した|ことは|ない。","おかねは あるに こした ことは ない。","Dinheiro, o melhor é ter."],
   ["健康に|越した|ことは|ない。","けんこうに こした ことは ない。","Nada melhor do que a saúde."],
   ["準備は|早いに|越した|ことは|ない。","じゅんびは はやいに こした ことは ない。","Quanto mais cedo a preparação, melhor."]],
q:[["旅行の荷物は軽い＿＿＿。",["に越したことはない","わけがない","ものか","ことはない"],"りょこうの にもつは かるいに こした ことは ない。","Bagagem de viagem, quanto mais leve melhor.","O ideal: に越したことはない."],
   ["用心する＿＿＿。",["に越したことはない","に決まっている","にすぎない","ものではない"],"ようじん するに こした ことは ない。","O melhor é tomar cuidado.","V dicionário + に越したことはない."],
   ["家は駅から近い＿＿＿が、家賃が高くなる。",["に越したことはない","にほかならない","に違いない","とは限らない"],"いえは えきから ちかいに こした ことは ない が、やちんが たかく なる。","O ideal é a casa perto da estação, mas o aluguel sobe.","Ideal + ressalva."]]},

{id:"ja-naikotomonai",u:"n2-24",t:"〜ないこともない",m:"não é que não (dá, mas com ressalva)",f:"V ない / adj い → くない / adj な + ないこともない・ないことはない",
e:"Afirmação fraca e hesitante: 行けないこともない = até dá para ir (mas não é fácil).",
c:"Dupla negativa = sim, com pouca vontade ou pouca certeza.",
x:[["急げば|間に合わない|ことも|ない。","いそげば まにあわない ことも ない。","Se correr, até dá para chegar a tempo."],
   ["納豆は|食べられない|ことも|ないが、|好きでは|ない。","なっとうは たべられない ことも ない が、すきでは ない。","Não é que eu não consiga comer natto, mas não gosto."],
   ["言われて|みれば、|似て|いない|ことも|ない。","いわれて みれば、にて いない ことも ない。","Pensando bem, até que é parecido."]],
q:[["A：この仕事、明日までにできる？B：頑張ればでき＿＿＿けど…。",["ないこともない","ることはない","っこない","かねない"],"がんばれば できない ことも ない けど…。","Se eu me esforçar, até consigo, mas…","Afirmação hesitante: ないこともない."],
   ["この服、少し高いけど、買えない＿＿＿。",["こともない","ことだ","ことか","ことに"],"この ふく、すこし たかい けど、かえない ことも ない。","Esta roupa é meio cara, mas até dá para comprar.","ないこともない."],
   ["辛い物は好きではないが、食べられない＿＿＿。",["ことはない","ことだ","わけだ","ものだ"],"からい ものは すきでは ない が、たべられない ことは ない。","Não gosto de comida apimentada, mas até consigo comer.","Variante: ないことはない."]]},

{id:"ja-wokikkakeni",u:"n2-25",t:"〜をきっかけに",m:"a partir de (um gatilho); motivado por",f:"S / V た + の + をきっかけに(して) / がきっかけで",

   ["病気を|したのを|きっかけに、|たばこを|やめた。","びょうきを したのを きっかけに、たばこを やめた。","Parei de fumar depois de ficar doente."],
   ["一冊の|本が|きっかけで、|作家に|なった。","いっさつの ほんが きっかけで、さっかに なった。","Um livro foi o ponto de partida para eu virar escritor."]],
q:[["結婚＿＿＿、料理を始めた。",["をきっかけに","を中心に","を除いて","のもとで"],"けっこん を きっかけに、りょうりを はじめた。","Comecei a cozinhar a partir do casamento.","Gatilho de mudança: をきっかけに."],
   ["引っ越したの＿＿＿、生活を見直した。",["をきっかけに","にこたえて","に比べて","をはじめ"],"ひっこしたの を きっかけに、せいかつを みなおした。","A mudança de casa me fez rever meu estilo de vida.","V た + の + をきっかけに."],
   ["友達の一言＿＿＿、ダイエットを始めた。",["がきっかけで","をもとに","によると","に限って"],"ともだちの ひとことが きっかけで、ダイエットを はじめた。","Um comentário de um amigo foi o que me fez começar a dieta.","がきっかけで."]]},
