/* ---------- de-1 ---------- */
{id:"de-perfekt",u:"de-1",t:"Perfekt: haben ou sein",m:"passado da conversa",f:"haben/sein conjugado + Partizip II no fim",
e:"O Perfekt é o passado do dia a dia falado. A maioria usa haben. Usam sein os verbos de movimento de um lugar a outro (gehen, fahren, fliegen) e de mudança de estado (aufstehen, einschlafen, sterben), além de sein, bleiben e werden.",
c:"Em português o verbo auxiliar não muda; em alemão, errar haben/sein é o erro mais comum do A2.",
x:[["Ich|habe|gestern|lange|gearbeitet.","","Ontem trabalhei muito."],
   ["Wir|sind|am Wochenende|nach Berlin|gefahren.","","No fim de semana fomos a Berlim."],
   ["Sie|ist|um sieben Uhr|aufgestanden.","","Ela se levantou às sete."]],
q:[["Letztes Jahr ___ ich nach Japan geflogen.",["bin","habe","war","wurde"],"Letztes Jahr bin ich nach Japan geflogen.","Ano passado voei para o Japão.","fliegen é movimento de um lugar a outro: sein."],
   ["Er ___ den ganzen Tag im Bett geblieben.",["ist","hat","war","wird"],"Er ist den ganzen Tag im Bett geblieben.","Ele ficou o dia todo na cama.","bleiben sempre usa sein."],
   ["Wir ___ zusammen Pizza gegessen.",["haben","sind","hatten","werden"],"Wir haben zusammen Pizza gegessen.","Comemos pizza juntos.","essen tem objeto e não é movimento: haben."]]},

{id:"de-perfekt-trennbar",u:"de-1",t:"Partizip II de separáveis e inseparáveis",m:"onde entra o ge-",f:"separável: an-ge-rufen; inseparável (be-, ver-, er-, ent-, ge-, zer-) e -ieren: sem ge-",
e:"Nos separáveis o ge- vai entre o prefixo e o verbo (eingekauft, angefangen). Nos inseparáveis e nos terminados em -ieren não há ge- (besucht, verstanden, telefoniert).",
c:"A tonicidade ajuda: prefixo tônico (ÁNrufen) separa; prefixo átono (beSUchen) não.",
x:[["Ich|habe|dich|gestern|angerufen.","","Te liguei ontem."],
   ["Hast du|den Text|verstanden?","","Você entendeu o texto?"],
   ["Wir|haben|im Supermarkt|eingekauft.","","Fizemos compras no supermercado."]],
q:[["Der Film hat um acht Uhr ___.",["angefangen","geanfangen","anfangen","angefangt"],"Der Film hat um acht Uhr angefangen.","O filme começou às oito.","anfangen é separável: an + ge + fangen."],
   ["Ich habe meine Oma ___.",["besucht","gebesucht","besuchte","gesucht"],"Ich habe meine Oma besucht.","Visitei minha avó.","be- é inseparável: sem ge-."],
   ["Sie hat mit ihrer Mutter ___.",["telefoniert","getelefoniert","telefonieren","telefonierte"],"Sie hat mit ihrer Mutter telefoniert.","Ela falou ao telefone com a mãe.","Verbos em -ieren não levam ge-."]]},

{id:"de-prateritum-modal",u:"de-1",t:"Präteritum de sein, haben e modais",m:"passado que se usa até na fala",f:"war, hatte, konnte, musste, wollte, durfte, sollte, mochte",
e:"Mesmo na conversa, sein, haben e os modais aparecem no Präteritum, não no Perfekt. Os modais perdem o trema: können → konnte.",
c:"Ich habe gekonnt soa estranho; o natural é ich konnte.",
x:[["Gestern|war|ich|sehr|müde.","","Ontem eu estava muito cansado."],
   ["Wir|hatten|keine Zeit.","","Não tínhamos tempo."],
   ["Ich|musste|lange|warten.","","Tive que esperar muito."]],
q:[["Als Kind ___ ich nicht schwimmen.",["konnte","könnte","kann","gekonnt"],"Als Kind konnte ich nicht schwimmen.","Quando criança eu não sabia nadar.","Präteritum de können: konnte (sem trema)."],
   ["Letzte Woche ___ wir einen Test.",["hatten","haben","hätten","sind"],"Letzte Woche hatten wir einen Test.","Semana passada tivemos uma prova.","haben no passado: hatten."],
   ["Wo ___ du gestern Abend?",["warst","bist","wärst","hattest"],"Wo warst du gestern Abend?","Onde você estava ontem à noite?","sein no passado, du: warst."]]},

{id:"de-prateritum",u:"de-1",t:"Präteritum de verbos comuns",m:"passado dos textos e notícias",f:"fracos: -te (machte, lernte); fortes: muda a vogal (ging, kam, sah, fand)",
e:"É o passado da escrita (notícias, histórias). Você precisa reconhecer: ging (gehen), kam (kommen), sah (sehen), gab (geben), fand (finden), blieb (bleiben).",
c:"Na fala, prefira o Perfekt; na leitura, reconheça o Präteritum.",
x:[["Er|ging|nach Hause|und|schlief|sofort ein.","","Ele foi para casa e dormiu na hora."],
   ["Plötzlich|kam|ein Mann|in den Raum.","","De repente um homem entrou na sala."],
   ["Sie|fand|ihren Schlüssel|nicht.","","Ela não encontrou a chave."]],
q:[["Gestern ___ ich einen alten Freund in der Stadt.",["sah","seh","sehte","gesehen"],"Gestern sah ich einen alten Freund in der Stadt.","Ontem vi um velho amigo na cidade.","sehen → sah."],
   ["Gestern ___ die Kinder im Garten.",["spielten","spielen","spielte","gespielt"],"Gestern spielten die Kinder im Garten.","Ontem as crianças brincaram no jardim.","Passado, plural, verbo fraco: spiel + ten."],
   ["Um neun Uhr ___ der Zug.",["kam","kommte","kamt","gekommen"],"Um neun Uhr kam der Zug.","Às nove o trem chegou.","kommen → kam."]]},

{id:"de-plusquamperfekt",u:"de-1",t:"Plusquamperfekt",m:"passado anterior a outro passado",f:"hatte/war + Partizip II",
e:"Mostra o que aconteceu antes de outro fato passado: Als ich ankam, war der Zug schon abgefahren.",
c:"Português: 'já tinha saído'. Mesmo haben/sein do Perfekt, só no passado.",
x:[["Als ich|ankam,|war|der Zug|schon|abgefahren.","","Quando cheguei, o trem já tinha partido."],
   ["Ich|hatte|das Buch|schon|gelesen.","","Eu já tinha lido o livro."],
   ["Nachdem|sie|gegessen|hatte,|ging|sie|spazieren.","","Depois de ter comido, ela foi passear."]],
q:[["Ich war müde, weil ich schlecht geschlafen ___.",["hatte","habe","war","bin"],"Ich war müde, weil ich schlecht geschlafen hatte.","Eu estava cansado porque tinha dormido mal.","Antes de outro passado: hatte + Partizip."],
   ["Als wir ins Kino kamen, ___ der Film schon angefangen.",["hatte","war","hat","ist"],"Als wir ins Kino kamen, hatte der Film schon angefangen.","Quando chegamos ao cinema, o filme já tinha começado.","anfangen usa haben → hatte."],
   ["Als ich ankam, ___ er schon nach Hause gegangen.",["war","hatte","ist","wurde"],"Als ich ankam, war er schon nach Hause gegangen.","Quando cheguei, ele já tinha ido para casa.","Antes de outro passado + gehen (sein) → war."]]},

/* ---------- de-2 ---------- */
{id:"de-akk-dat",u:"de-2",t:"Akkusativ × Dativ",m:"objeto direto × indireto",f:"Akk: den/die/das/die · einen/eine/ein; Dat: dem/der/dem/den(+n) · einem/einer/einem",
e:"Com dois objetos, a pessoa costuma ir no Dativ e a coisa no Akkusativ: Ich gebe dem Mann das Buch.",
c:"Só o masculino muda no Akkusativ (der → den). No Dativ tudo muda, e o plural ganha -n: den Kindern.",
x:[["Ich|gebe|dem Kind|einen Apfel.","","Dou uma maçã para a criança."],
   ["Sie|schenkt|ihrer Mutter|eine Blume.","","Ela dá uma flor de presente para a mãe."],
   ["Er|zeigt|den Touristen|den Weg.","","Ele mostra o caminho aos turistas."]],
q:[["Ich schreibe ___ Freund eine E-Mail.",["meinem","meinen","mein","meiner"],"Ich schreibe meinem Freund eine E-Mail.","Escrevo um e-mail para meu amigo.","Destinatário (pessoa) no Dativ masculino: meinem."],
   ["Hast du ___ Schlüssel gesehen?",["den","dem","der","des"],"Hast du den Schlüssel gesehen?","Você viu a chave?","Objeto direto masculino: den."],
   ["Wir helfen ___ Kindern bei den Hausaufgaben.",["den","die","dem","der"],"Wir helfen den Kindern bei den Hausaufgaben.","Ajudamos as crianças com o dever de casa.","Dativ plural: den + substantivo com -n."]]},

{id:"de-wechselprap",u:"de-2",t:"Preposições de duas vias",m:"Wo? (Dativ) × Wohin? (Akkusativ)",f:"in, an, auf, über, unter, vor, hinter, neben, zwischen",
e:"Com lugar parado (Wo?) usa Dativ; com movimento para um destino (Wohin?) usa Akkusativ. Os verbos ajudam: liegen/stehen/hängen (Dat) × legen/stellen/hängen (Akk).",
c:"im = in dem; ins = in das; am = an dem.",
x:[["Das Buch|liegt|auf dem Tisch.","","O livro está sobre a mesa."],
   ["Ich|lege|das Buch|auf den Tisch.","","Coloco o livro sobre a mesa."],
   ["Wir|gehen|heute Abend|ins Kino.","","Hoje à noite vamos ao cinema."]],
q:[["Die Katze schläft unter ___ Bett.",["dem","das","den","der"],"Die Katze schläft unter dem Bett.","O gato dorme debaixo da cama.","Sem movimento (Wo?): Dativ, das Bett → dem."],
   ["Stell die Flasche bitte in ___ Kühlschrank.",["den","dem","der","das"],"Stell die Flasche bitte in den Kühlschrank.","Coloque a garrafa na geladeira.","Movimento para destino (Wohin?): Akkusativ, der → den."],
   ["Das Bild hängt an ___ Wand.",["der","die","dem","den"],"Das Bild hängt an der Wand.","O quadro está pendurado na parede.","Parado: Dativ feminino der."]]},

{id:"de-dativverben",u:"de-2",t:"Verbos que pedem Dativ",m:"helfen, gefallen, gehören, danken, antworten",
f:"verbo + objeto no Dativ",
e:"Alguns verbos pedem Dativ mesmo com um só objeto: helfen, danken, gefallen, gehören, antworten, gratulieren, passen, schmecken.",
c:"Das Kleid gefällt mir = o vestido agrada a mim (eu gosto do vestido). O sujeito é a coisa.",
x:[["Kannst du|mir|helfen?","","Você pode me ajudar?"],
   ["Die Wohnung|gefällt|uns|sehr.","","Gostamos muito do apartamento."],
   ["Wem|gehört|dieses Handy?","","De quem é este celular?"]],
q:[["Ich danke ___ für das Geschenk.",["dir","dich","du","dein"],"Ich danke dir für das Geschenk.","Obrigado pelo presente.","danken pede Dativ: dir."],
   ["Kinder, schmeckt ___ die Suppe?",["euch","ihr","eure","euer"],"Kinder, schmeckt euch die Suppe?","Crianças, vocês estão gostando da sopa?","Falando com vocês (ihr): schmecken + Dativ → euch. \"ihr\" aqui seria \"a ela\"."],

{id:"de-pronomen-dativ",u:"de-2",t:"Pronomes no Dativ e ordem",m:"mir, dir, ihm, ihr, uns, euch, ihnen/Ihnen",
f:"Nom ich/du/er/sie/wir/ihr/sie → Dat mir/dir/ihm/ihr/uns/euch/ihnen",

   ["Ich|gebe|es|ihm.","","Dou-o para ele."],
   ["Kannst du|es|mir|erklären?","","Você pode me explicar isso?"]],
q:[["Maria hat Geburtstag. Ich schenke ___ ein Buch.",["ihr","sie","ihm","ihre"],"Maria hat Geburtstag. Ich schenke ihr ein Buch.","É aniversário da Maria. Vou dar um livro para ela.","sie (ela) no Dativ: ihr."],
   ["Wie geht es ___, Herr Müller?",["Ihnen","Sie","Ihr","ihnen"],"Wie geht es Ihnen, Herr Müller?","Como vai o senhor, sr. Müller?","Formal no Dativ: Ihnen (maiúsculo)."],
   ["Die Uhr? Mein Vater hat ___ geschenkt.",["sie mir","mir sie","ihr mich","mich sie"],"Die Uhr? Mein Vater hat sie mir geschenkt.","O relógio? Meu pai me deu de presente.","Dois pronomes: Akkusativ (sie) antes do Dativ (mir)."]]},

{id:"de-genitiv",u:"de-2",t:"Genitiv com wegen e trotz",m:"por causa de / apesar de",f:"wegen/trotz + des/der/des/der (+ -s/-es no masc. e neutro)",
e:"Na escrita e em situações formais, wegen, trotz e während pedem Genitiv: wegen des Regens.",
c:"Na fala informal muita gente usa Dativ (wegen dem Regen); em prova, use Genitiv.",
x:[["Wegen|des Regens|bleiben|wir|zu Hause.","","Por causa da chuva, ficamos em casa."],
   ["Trotz|der Kälte|gehen|sie|joggen.","","Apesar do frio, eles vão correr."],
   ["Das ist|das Auto|meines Bruders.","","Este é o carro do meu irmão."]],
q:[["Wegen ___ Streiks fährt heute kein Zug.",["des","dem","den","der"],"Wegen des Streiks fährt heute kein Zug.","Por causa da greve, nenhum trem roda hoje.","Genitiv masculino: des + Streiks."],
   ["Trotz ___ Probleme hat er weitergemacht.",["der","den","die","des"],"Trotz der Probleme hat er weitergemacht.","Apesar dos problemas, ele continuou.","Genitiv plural: der."],
   ["Das ist die Tasche ___ Lehrerin.",["der","die","des","dem"],"Das ist die Tasche der Lehrerin.","Esta é a bolsa da professora.","Genitiv feminino: der."]]},

/* ---------- de-3 ---------- */
{id:"de-weil",u:"de-3",t:"weil / da",m:"porque / como",f:"weil + … + verbo no fim",
e:"Na oração com weil o verbo conjugado vai para o fim. da é mais formal e costuma abrir a frase.",
c:"denn também é 'porque', mas não muda a ordem: …, denn ich bin müde.",
x:[["Ich|bleibe|zu Hause,|weil|ich|krank|bin.","","Fico em casa porque estou doente."],
   ["Da|es|regnet,|nehmen|wir|den Bus.","","Como está chovendo, pegamos o ônibus."],
   ["Er|lernt|Deutsch,|weil|er|in Berlin|arbeiten|möchte.","","Ele estuda alemão porque quer trabalhar em Berlim."]],
q:[["Ich komme zu spät, weil der Bus ___.",["Verspätung hatte","hatte Verspätung","Verspätung hat gehabt","hat Verspätung"],"Ich komme zu spät, weil der Bus Verspätung hatte.","Chego atrasado porque o ônibus atrasou.","Depois de weil, verbo conjugado no fim."],
   ["Ich trinke keinen Kaffee, ___ ich schlafen will.",["weil","denn","deshalb","trotzdem"],"Ich trinke keinen Kaffee, weil ich schlafen will.","Não tomo café porque quero dormir.","Verbo no fim (will) → weil."],
   ["Ich bin müde, ___ ich habe wenig geschlafen.",["denn","weil","da","dass"],"Ich bin müde, denn ich habe wenig geschlafen.","Estou cansado, pois dormi pouco.","Ordem normal (habe logo depois): denn."]]},

{id:"de-dass",u:"de-3",t:"dass",m:"que",f:"verbo principal + , dass + … + verbo no fim",
e:"Introduz o conteúdo de um pensamento ou fala: Ich glaube, dass… / Ich hoffe, dass…",
c:"das (artigo/pronome) × dass (conjunção). Se der para trocar por 'que' ligando orações, é dass.",
x:[["Ich|glaube,|dass|er|recht|hat.","","Acho que ele tem razão."],
   ["Sie|sagt,|dass|sie|morgen|keine Zeit|hat.","","Ela diz que amanhã não tem tempo."],
   ["Es ist|wichtig,|dass|du|regelmäßig|übst.","","É importante que você pratique regularmente."]],
q:[["Ich hoffe, dass du bald wieder gesund ___.",["bist","sein","bist du","ist"],"Ich hoffe, dass du bald wieder gesund bist.","Espero que você fique bom logo.","dass manda o verbo para o fim: bist."],
   ["Weißt du, ___ das Museum heute geschlossen ist?",["dass","das","was","ob"],"Weißt du, dass das Museum heute geschlossen ist?","Você sabe que o museu está fechado hoje?","Conjunção: dass."],
   ["Er hat gesagt, dass er später ___.",["kommt","kommt er","kommen","er kommt"],"Er hat gesagt, dass er später kommt.","Ele disse que vem mais tarde.","Sujeito logo após dass, verbo no fim."]]},

{id:"de-wenn-als",u:"de-3",t:"wenn × als",m:"quando (repetido/futuro) × quando (uma vez no passado)",f:"als = fato único no passado; wenn = presente, futuro ou repetição (immer wenn)",
e:"Als ich Kind war (uma fase única) × Wenn ich nach Hause komme (sempre/futuro). Nos dois, verbo no fim.",
c:"wenn também é 'se' (condição).",
x:[["Als|ich|zehn|war,|zogen|wir|nach München.","","Quando eu tinha dez anos, nos mudamos para Munique."],
   ["Wenn|ich|Zeit|habe,|lese|ich.","","Quando tenho tempo, leio."],
   ["Immer|wenn|es|regnet,|bleibe|ich|zu Hause.","","Sempre que chove, fico em casa."]],
q:[["___ ich gestern nach Hause kam, war niemand da.",["Als","Wenn","Wann","Ob"],"Als ich gestern nach Hause kam, war niemand da.","Quando cheguei em casa ontem, não havia ninguém.","Uma vez no passado: als."],
   ["___ ich in Japan bin, esse ich jeden Tag Sushi.",["Wenn","Als","Wann","Dass"],"Wenn ich in Japan bin, esse ich jeden Tag Sushi.","Quando estou no Japão, como sushi todo dia.","Repetição/presente: wenn."],
   ["Immer ___ wir uns trafen, haben wir gelacht.",["wenn","als","wann","ob"],"Immer wenn wir uns trafen, haben wir gelacht.","Sempre que nos encontrávamos, ríamos.","Repetição no passado: immer wenn."]]},

{id:"de-obwohl",u:"de-3",t:"obwohl",m:"embora; apesar de",f:"obwohl + … + verbo no fim",
e:"Concessão: o esperado não acontece. Obwohl es regnet, gehe ich spazieren.",
c:"trotzdem diz o mesmo, mas numa oração principal: Es regnet. Trotzdem gehe ich spazieren.",
x:[["Obwohl|er|müde|ist,|arbeitet|er|weiter.","","Embora esteja cansado, ele continua trabalhando."],
   ["Ich|gehe|joggen,|obwohl|es|kalt|ist.","","Vou correr, embora esteja frio."],
   ["Obwohl|sie|viel|gelernt|hat,|hat|sie|die Prüfung|nicht|bestanden.","","Embora tenha estudado muito, não passou na prova."]],
q:[["___ das Essen teuer war, war es nicht gut.",["Obwohl","Weil","Wenn","Dass"],"Obwohl das Essen teuer war, war es nicht gut.","Embora a comida fosse cara, não era boa.","Contraste com expectativa: obwohl."],
   ["Er kommt zur Party, obwohl er keine Lust ___.",["hat","haben","hat er","hatte er"],"Er kommt zur Party, obwohl er keine Lust hat.","Ele vem à festa, embora não esteja com vontade.","Verbo no fim."],
   ["Es ist spät. ___ möchte ich noch einen Film sehen.",["Trotzdem","Obwohl","Weil","Wenn"],"Es ist spät. Trotzdem möchte ich noch einen Film sehen.","Está tarde. Mesmo assim quero ver mais um filme.","Oração principal com verbo em 2ª posição: trotzdem."]]},

{id:"de-indirekte-frage",u:"de-3",t:"Perguntas indiretas",m:"Você sabe se/onde/quando…?",f:"Wissen Sie, + ob / wo / wann / wie + … + verbo no fim",
e:"Pergunta sim/não vira ob; pergunta com W mantém a palavra W. O verbo vai para o fim. Soa mais educado.",
c:"ob = se (dúvida); wenn = se (condição).",
x:[["Können Sie|mir sagen,|wo|der Bahnhof|ist?","","Pode me dizer onde fica a estação?"],
   ["Ich|weiß|nicht,|ob|er|heute|kommt.","","Não sei se ele vem hoje."],
   ["Weißt du,|wann|der Kurs|beginnt?","","Você sabe quando o curso começa?"]],
q:[["Ich frage mich, ___ sie mich noch liebt.",["ob","wenn","dass","wann"],"Ich frage mich, ob sie mich noch liebt.","Eu me pergunto se ela ainda me ama.","Pergunta sim/não indireta: ob."],
   ["Können Sie mir sagen, wie viel das ___?",["kostet","kostet es","kosten","es kostet"],"Können Sie mir sagen, wie viel das kostet?","Pode me dizer quanto custa?","Verbo no fim."],
   ["Weißt du, ___ Susanne wohnt?",["wo","ob","wenn","dass"],"Weißt du, wo Susanne wohnt?","Você sabe onde a Susanne mora?","Mantém a palavra W: wo."]]},

/* ---------- de-4 ---------- */
{id:"de-adj-bestimmt",u:"de-4",t:"Adjetivo depois de der/die/das",m:"terminações -e / -en",f:"Nom. sing.: -e; Akk. fem. e neutro: -e; resto: -en",
e:"Depois do artigo definido, o artigo já mostra o caso, então o adjetivo fica com -e ou -en. Regra rápida: masculino Akkusativ, todo Dativ, Genitiv e plural → -en.",
c:"der neue Job, die neue Wohnung, das neue Auto, die neuen Freunde.",
x:[["Der|alte Mann|wohnt|hier.","","O homem velho mora aqui."],
   ["Ich|kaufe|den roten Pullover.","","Compro o pulôver vermelho."],
   ["Wir|helfen|der kleinen Schwester.","","Ajudamos a irmã pequena."]],
q:[["Ich nehme den ___ Mantel.",["schwarzen","schwarze","schwarzer","schwarzes"],"Ich nehme den schwarzen Mantel.","Levo o casaco preto.","Masculino Akkusativ: -en."],
   ["Die ___ Wohnung ist sehr hell.",["neue","neuen","neuer","neues"],"Die neue Wohnung ist sehr hell.","O apartamento novo é muito claro.","Nominativo singular: -e."],
   ["Mit den ___ Kollegen gehe ich essen.",["neuen","neue","neuem","neuer"],"Mit den neuen Kollegen gehe ich essen.","Vou comer com os colegas novos.","Dativ plural: -en."]]},

{id:"de-adj-unbestimmt",u:"de-4",t:"Adjetivo depois de ein/kein/mein",m:"o adjetivo mostra o gênero",f:"Nom.: ein guter Wein / eine gute Idee / ein gutes Buch",
e:"Quando ein não mostra o gênero (masculino e neutro no Nom., neutro no Akk.), o adjetivo mostra: -er (masc.), -es (neutro). No resto, igual à regra anterior.",
c:"ein großer Hund, einen großen Hund, ein kleines Kind, mit einem kleinen Kind.",
x:[["Das ist|ein guter Film.","","É um bom filme."],
   ["Ich|habe|ein neues Handy.","","Tenho um celular novo."],
   ["Sie|trägt|eine schöne Jacke.","","Ela está com uma jaqueta bonita."]],
q:[["Er hat einen ___ Job gefunden.",["interessanten","interessanter","interessantes","interessante"],"Er hat einen interessanten Job gefunden.","Ele encontrou um emprego interessante.","Masculino Akkusativ: -en."],
   ["Das ist ein ___ Restaurant.",["teures","teurer","teuren","teure"],"Das ist ein teures Restaurant.","É um restaurante caro.","Neutro com ein: adjetivo mostra o gênero → -es."],
   ["Mein ___ Bruder studiert in Wien.",["älterer","ältere","älteren","älteres"],"Mein älterer Bruder studiert in Wien.","Meu irmão mais velho estuda em Viena.","Masculino Nom. com mein: -er."]]},

{id:"de-adj-ohne",u:"de-4",t:"Adjetivo sem artigo",m:"o adjetivo leva a terminação do artigo",f:"guter Kaffee, frische Milch, kaltes Wasser, mit heißem Tee",
e:"Sem artigo, o adjetivo assume a terminação que o artigo teria (der → -er, die → -e, das → -es, dem → -em).",
c:"Comum com comida, bebida e plural: gute Freunde, frisches Brot.",
x:[["Ich|trinke|gern|kalten Tee.","","Gosto de chá gelado."],
   ["Frisches Brot|riecht|gut.","","Pão fresco tem cheiro bom."],
   ["Wir|suchen|nette Leute.","","Procuramos pessoas legais."]],
q:[["Ich mag ___ Kaffee.",["starken","starker","starkes","starke"],"Ich mag starken Kaffee.","Gosto de café forte.","der Kaffee, Akkusativ → den → -en."],
   ["___ Wasser ist gesund.",["Kaltes","Kalte","Kalter","Kalten"],"Kaltes Wasser ist gesund.","Água fria é saudável.","das Wasser → -es."],
   ["Mit ___ Grüßen",["freundlichen","freundliche","freundlicher","freundlichem"],"Mit freundlichen Grüßen","Atenciosamente","Dativ plural: -en (fecho formal de carta)."]]},

{id:"de-komparativ",u:"de-4",t:"Comparativo e superlativo",m:"mais… que / o mais…",f:"-er + als; am -sten; irregulares: gut–besser–am besten, viel–mehr–am meisten, gern–lieber–am liebsten",
e:"Adjetivos curtos com a, o, u costumam ganhar trema: alt–älter, groß–größer, jung–jünger.",
c:"Igualdade: so … wie (so groß wie). Diferença: …er als (größer als).",
x:[["Berlin|ist|größer|als|München.","","Berlim é maior que Munique."],
   ["Ich|trinke|lieber|Tee|als|Kaffee.","","Prefiro chá a café."],
   ["Im Sommer|sind|die Tage|am längsten.","","No verão os dias são os mais longos."]],
q:[["Mein Bruder ist zwei Jahre ___ als ich.",["älter","alter","mehr alt","am ältesten"],"Mein Bruder ist zwei Jahre älter als ich.","Meu irmão é dois anos mais velho que eu.","alt → älter (com trema)."],
   ["Dieses Handy ist so teuer ___ das andere.",["wie","als","dann","wenn"],"Dieses Handy ist so teuer wie das andere.","Este celular é tão caro quanto o outro.","Igualdade: so … wie."],
   ["Was machst du am ___?",["liebsten","liebesten","meisten gern","gernsten"],"Was machst du am liebsten?","O que você mais gosta de fazer?","gern → lieber → am liebsten."]]},

{id:"de-adj-nomen",u:"de-4",t:"Adjetivo como substantivo",m:"der Deutsche, ein Bekannter, etwas Neues",f:"maiúscula + terminação de adjetivo",
e:"Adjetivos viram substantivos e continuam flexionando como adjetivos: der Erwachsene, ein Erwachsener. Depois de etwas/nichts/viel: -es (etwas Neues).",
c:"Parecido com 'o novo', 'os jovens' em português.",
x:[["Ein Bekannter|hat|mir|geholfen.","","Um conhecido me ajudou."],
   ["Gibt es|etwas Neues?","","Tem alguma novidade?"],
   ["Die Jugendlichen|treffen sich|im Park.","","Os jovens se encontram no parque."]],
q:[["Ich wünsche dir alles ___!",["Gute","Gutes","Guten","Guter"],"Ich wünsche dir alles Gute!","Te desejo tudo de bom!","Depois de alles: -e (alles Gute)."],
   ["Er ist ein ___ von mir.",["Verwandter","Verwandte","Verwandten","Verwandtes"],"Er ist ein Verwandter von mir.","Ele é um parente meu.","Masculino com ein: -er."],
   ["Heute habe ich nichts ___ gelernt.",["Neues","Neue","Neuen","Neuer"],"Heute habe ich nichts Neues gelernt.","Hoje não aprendi nada novo.","Depois de nichts: -es."]]},

/* ---------- de-5 ---------- */
{id:"de-reflexiv",u:"de-5",t:"Verbos reflexivos",m:"sich freuen, sich treffen, sich erinnern",f:"mich, dich, sich, uns, euch, sich (Akk.) / mir, dir (Dat. com outro objeto)",
e:"Muitos verbos alemães são reflexivos sem ser em português: sich beeilen (apressar-se), sich erholen (descansar). Com outro objeto, o pronome vai para o Dativ: Ich wasche mir die Hände.",
c:"Na oração principal o pronome vem logo após o verbo: Ich freue mich.",
x:[["Ich|freue|mich|auf das Wochenende.","","Estou animado com o fim de semana."],
   ["Wir|treffen|uns|um acht.","","Nos encontramos às oito."],
   ["Ich|putze|mir|die Zähne.","","Escovo os dentes."]],
q:[["Beeil ___, der Zug fährt gleich!",["dich","dir","sich","du"],"Beeil dich, der Zug fährt gleich!","Se apresse, o trem já vai sair!","du no Akkusativ reflexivo: dich."],
   ["Kannst du ___ an seinen Namen erinnern?",["dich","dir","sich","mich"],"Kannst du dich an seinen Namen erinnern?","Você consegue se lembrar do nome dele?","sich erinnern an + Akk; du → dich."],
   ["Ich wasche ___ die Hände.",["mir","mich","sich","meine"],"Ich wasche mir die Hände.","Lavo as mãos.","Com outro objeto (die Hände): Dativ mir."]]},

{id:"de-verb-prap",u:"de-5",t:"Verbos com preposição fixa",m:"warten auf, denken an, sich interessieren für",f:"verbo + preposição + caso fixo (decorar juntos)",
e:"A preposição é parte do verbo e muitas vezes difere do português: warten auf (esperar por), Angst haben vor (ter medo de), sich kümmern um (cuidar de).",
c:"Aprenda sempre em bloco: 'sich freuen auf + Akk' (futuro) × 'sich freuen über + Akk' (presente/passado).",
x:[["Ich|warte|auf den Bus.","","Estou esperando o ônibus."],
   ["Sie|interessiert sich|für Kunst.","","Ela se interessa por arte."],
   ["Er|hat|Angst|vor Hunden.","","Ele tem medo de cachorros."]],
q:[["Ich denke oft ___ meine Kindheit.",["an","von","über","auf"],"Ich denke oft an meine Kindheit.","Penso muito na minha infância.","denken an + Akk."],
   ["Wir freuen uns ___ den Urlaub nächsten Monat.",["auf","über","an","für"],"Wir freuen uns auf den Urlaub nächsten Monat.","Estamos ansiosos pelas férias do mês que vem.","Algo futuro: sich freuen auf."],
   ["Wer kümmert sich ___ die Katze?",["um","für","auf","an"],"Wer kümmert sich um die Katze?","Quem cuida do gato?","sich kümmern um + Akk."]]},

{id:"de-da-wo",u:"de-5",t:"da- e wo- com preposições",m:"darauf, daran, worauf, woran",f:"da(r) + preposição (coisa); wo(r) + preposição (pergunta sobre coisa); para pessoas: preposição + pronome",
e:"Para retomar uma coisa depois de verbo com preposição: Ich warte darauf. Para perguntar: Worauf wartest du? Com vogal, entra -r-: darüber, woran.",
c:"Para pessoas não se usa da-: Ich warte auf ihn / Auf wen wartest du?",
x:[["Worauf|wartest|du?|–|Auf den Bus.","","Está esperando o quê? – O ônibus."],
   ["Ich|habe|keine Lust|darauf.","","Não estou com vontade disso."],
   ["Woran|denkst|du?","","Em que você está pensando?"]],
q:[["Die Prüfung ist morgen. Ich denke die ganze Zeit ___.",["daran","an sie","woran","an es"],"Die Prüfung ist morgen. Ich denke die ganze Zeit daran.","A prova é amanhã. Penso nela o tempo todo.","Coisa + denken an → daran."],
   ["___ interessierst du dich?",["Wofür","Für was","Worauf","Wovon"],"Wofür interessierst du dich?","Pelo que você se interessa?","sich interessieren für → wofür."],
   ["Mein Opa? Ja, ich denke oft ___.",["an ihn","daran","woran","an es"],"Mein Opa? Ja, ich denke oft an ihn.","Meu avô? Sim, penso muito nele.","Pessoa: preposição + pronome (an ihn)."]]},

{id:"de-zu-inf",u:"de-5",t:"zu + infinitivo",m:"de + infinitivo",f:"… , zu + infinitivo no fim; separáveis: anzurufen",
e:"Depois de verbos como versuchen, vergessen, anfangen, Lust haben, es ist wichtig: Ich versuche, mehr zu lesen.",
c:"Modais (können, müssen, wollen) e werden NÃO usam zu: Ich muss lernen.",
x:[["Ich|habe|vergessen,|dich|anzurufen.","","Esqueci de te ligar."],
   ["Es ist|schwer,|früh|aufzustehen.","","É difícil acordar cedo."],
   ["Hast du|Lust,|ins Kino|zu gehen?","","Está a fim de ir ao cinema?"]],
q:[["Ich versuche, jeden Tag Deutsch ___.",["zu lernen","lernen","zu lerne","lernen zu"],"Ich versuche, jeden Tag Deutsch zu lernen.","Tento estudar alemão todo dia.","versuchen + zu + infinitivo."],
   ["Vergiss nicht, die Tür ___.",["abzuschließen","zu abschließen","abschließen","abzuschließt"],"Vergiss nicht, die Tür abzuschließen.","Não esqueça de trancar a porta.","Separável: zu entre prefixo e verbo."],
   ["Ich muss morgen früh ___.",["aufstehen","aufzustehen","zu aufstehen","aufgestanden"],"Ich muss morgen früh aufstehen.","Tenho que acordar cedo amanhã.","Modal (müssen) não leva zu."]]},

{id:"de-um-zu-damit",u:"de-5",t:"um … zu × damit",m:"para (finalidade)",f:"mesmo sujeito: um … zu + infinitivo; sujeitos diferentes: damit + … + verbo no fim",
e:"Ich lerne Deutsch, um in Deutschland zu arbeiten (eu estudo, eu trabalho). Ich spreche langsam, damit du mich verstehst (eu falo, você entende).",
c:"damit também serve com o mesmo sujeito, mas um…zu soa mais natural.",
x:[["Ich|spare|Geld,|um|ein Auto|zu kaufen.","","Economizo para comprar um carro."],
   ["Er|spricht|laut,|damit|alle|ihn|hören.","","Ele fala alto para que todos o ouçam."],
   ["Sie|geht|früh|ins Bett,|um|fit|zu sein.","","Ela vai dormir cedo para estar descansada."]],
q:[["Ich jogge, ___ gesund zu bleiben.",["um","damit","dass","für"],"Ich jogge, um gesund zu bleiben.","Corro para continuar saudável.","Mesmo sujeito + zu: um."],
   ["Ich erkläre es noch einmal, ___ du es verstehst.",["damit","um","dass","weil"],"Ich erkläre es noch einmal, damit du es verstehst.","Explico de novo para que você entenda.","Sujeitos diferentes: damit."],
   ["Wir fahren nach Hamburg, um unsere Freunde ___.",["zu besuchen","besuchen","zu besucht","besuchen zu"],"Wir fahren nach Hamburg, um unsere Freunde zu besuchen.","Vamos a Hamburgo para visitar nossos amigos.","um … zu + infinitivo."]]},

/* ---------- de-6 ---------- */
{id:"de-wurde",u:"de-6",t:"würde + infinitivo",m:"faria (Konjunktiv II)",f:"würde (ich/er/sie/es), würdest, würden, würdet + infinitivo no fim",
e:"Forma mais usada do Konjunktiv II para desejos, hipóteses e pedidos educados: Ich würde gern reisen.",
c:"Com sein, haben e modais prefira a forma própria (wäre, hätte, könnte).",
x:[["Ich|würde|gern|in Japan|leben.","","Eu gostaria de morar no Japão."],
   ["Würden|Sie|bitte|das Fenster|schließen?","","O senhor poderia fechar a janela?"],
   ["An deiner Stelle|würde|ich|zum Arzt|gehen.","","No seu lugar, eu iria ao médico."]],
q:[["Was ___ du mit einer Million Euro machen?",["würdest","wirst","wurdest","würde"],"Was würdest du mit einer Million Euro machen?","O que você faria com um milhão de euros?","du → würdest."],
   ["___ Sie mir bitte helfen?",["Würden","Werden","Wurden","Würdet"],"Würden Sie mir bitte helfen?","O senhor poderia me ajudar?","Pedido educado formal: Würden Sie."],
   ["Ich würde lieber zu Hause ___.",["bleiben","bleibe","geblieben","zu bleiben"],"Ich würde lieber zu Hause bleiben.","Eu preferiria ficar em casa.","würde + infinitivo no fim."]]},

{id:"de-hatte-ware",u:"de-6",t:"hätte, wäre, könnte",m:"teria, seria/estaria, poderia",f:"hätte, wäre, könnte, müsste, dürfte",
e:"Formas próprias do Konjunktiv II: Ich hätte gern einen Kaffee (pedido). Das wäre toll (seria ótimo).",
c:"hatte (tinha) × hätte (teria): o trema muda o sentido.",

{id:"de-irreal",u:"de-6",t:"Condição irreal com wenn",m:"se eu fosse/tivesse…",f:"Wenn + Konjunktiv II (verbo no fim), würde/wäre/hätte + …",

   ["Wenn ich nur besser Deutsch ___!",["könnte","kann","konnte","kannte"],"Wenn ich nur besser Deutsch könnte!","Ah, se eu soubesse alemão melhor!","Desejo irreal: könnte."],

{id:"de-relativ",u:"de-7",t:"Relativsatz (Nom. e Akk.)",m:"que / o qual",f:"der/die/das/die (Nom.), den/die/das/die (Akk.) + … + verbo no fim",

   ["Das ist der Pullover, ___ ich gekauft habe.",["den","der","dem","das"],"Das ist der Pullover, den ich gekauft habe.","Este é o pulôver que eu comprei.","Eu comprei ele: Akkusativ den."],
   ["Das Buch, ___ auf dem Tisch liegt, gehört mir.",["das","der","die","den"],"Das Buch, das auf dem Tisch liegt, gehört mir.","O livro que está na mesa é meu.","das Buch, sujeito: das."]]},

{id:"de-relativ-dat",u:"de-7",t:"Relativsatz com Dativ e preposição",m:"a quem / com quem / no qual",f:"Dat.: dem/der/dem/denen; preposição + pronome relativo",

   ["Der Kollege, mit ___ ich arbeite, kommt aus Wien.",["dem","den","der","denen"],"Der Kollege, mit dem ich arbeite, kommt aus Wien.","O colega com quem trabalho é de Viena.","mit + Dativ masculino: dem."],
   ["Die Firma, für ___ sie arbeitet, ist international.",["die","der","den","dem"],"Die Firma, für die sie arbeitet, ist international.","A empresa para a qual ela trabalha é internacional.","für + Akkusativ feminino: die."]]},

{id:"de-deshalb",u:"de-7",t:"deshalb, trotzdem, dann",m:"por isso / mesmo assim / então",f:"conector na 1ª posição + verbo na 2ª posição + sujeito",

   ["Ich hatte keine Lust. ___ bin ich mitgegangen.",["Trotzdem","Obwohl","Weil","Deshalb"],"Ich hatte keine Lust. Trotzdem bin ich mitgegangen.","Eu não estava a fim. Mesmo assim fui junto.","Contraste + inversão: trotzdem."],

   ["Das Museum ist montags ___.",["geschlossen","schließen","geschließt","schloss"],"Das Museum ist montags geschlossen.","O museu fica fechado às segundas.","Estado: ist geschlossen."]]},

{id:"de-sein-zu",u:"de-9",t:"sein + zu + infinitivo",m:"precisa/pode ser feito (formal)",f:"sein + zu + infinitivo (separável: anzumelden)",
e:"Substitui a passiva com müssen ou können, muito comum em avisos e documentos: Der Ausweis ist mitzubringen (deve ser trazido).",
c:"O sentido (dever ou poder) vem do contexto: Das ist nicht zu schaffen = não dá para conseguir.",
x:[["Der Ausweis|ist|am Eingang|vorzuzeigen.","","A identidade deve ser apresentada na entrada."],
   ["Das Problem|ist|leicht|zu lösen.","","O problema é fácil de resolver."],
   ["Die Gebühr|ist|bis Ende des Monats|zu zahlen.","","A taxa deve ser paga até o fim do mês."]],
q:[["Die Anmeldung ist bis Freitag ___.",["abzugeben","zu abgeben","abgeben","abgegeben zu"],"Die Anmeldung ist bis Freitag abzugeben.","A inscrição deve ser entregue até sexta.","Separável: zu entre prefixo e verbo."],
   ["Seine Handschrift ist kaum ___ lesen.",["zu","um","für","zum"],"Seine Handschrift ist kaum zu lesen.","A letra dele quase não dá para ler.","sein + zu + infinitivo = pode ser feito."],
   ["Die Medikamente sind kühl ___.",["zu lagern","lagern zu","gelagert","lagern"],"Die Medikamente sind kühl zu lagern.","Os medicamentos devem ser guardados em local fresco.","Instrução formal: sind … zu lagern."]]},

{id:"de-lassen-bar",u:"de-9",t:"sich lassen e adjetivos em -bar",m:"dá para ser feito",f:"sich lassen + infinitivo · radical do verbo + -bar",
e:"Outras formas de dizer 'pode ser feito': Das Fenster lässt sich nicht öffnen / Das Fenster ist nicht öffenbar. -bar é muito produtivo: machbar, lesbar, erreichbar.",
c:"Die Aufgabe lässt sich lösen = Die Aufgabe ist lösbar = Die Aufgabe kann gelöst werden.",
x:[["Das Problem|lässt sich|leicht|lösen.","","O problema se resolve facilmente."],
   ["Das Wasser|ist|nicht|trinkbar.","","A água não é potável."],
   ["Ich bin|ab 9 Uhr|telefonisch|erreichbar.","","A partir das 9h dá para falar comigo por telefone."]],
q:[["Die Tür ___ sich nicht schließen.",["lässt","ist","wird","kann"],"Die Tür lässt sich nicht schließen.","A porta não fecha.","sich lassen + infinitivo."],
   ["Dieser Plan ist in zwei Wochen nicht ___.",["machbar","machlich","gemacht","machend"],"Dieser Plan ist in zwei Wochen nicht machbar.","Este plano não é viável em duas semanas.","machen → machbar (pode ser feito)."],
   ["Das Ergebnis kann sich sehen ___.",["lassen","gelassen","lässt","ließ"],"Das Ergebnis kann sich sehen lassen.","O resultado é digno de nota.","Expressão fixa: sich sehen lassen können (ser apresentável)."]]},

/* ---------- de-10 ---------- */
{id:"de-konj1",u:"de-10",t:"Konjunktiv I: formas",m:"forma do discurso indireto",f:"radical do infinitivo + -e (er komme, er habe, er müsse) · sein: er sei, sie seien",
e:"Usado quase só na 3ª pessoa do singular, em notícias: Der Minister sagt, er sei zufrieden. Se a forma for igual ao indicativo, usa-se Konjunktiv II.",
c:"sei (sein), habe (haben), werde (werden), könne, müsse, gebe, komme. Ele indica: 'segundo ele', sem o jornalista afirmar.",
x:[["Der Sprecher|sagte,|die Lage|sei|unter Kontrolle.","","O porta-voz disse que a situação estaria sob controle."],
   ["Sie|behauptet,|sie|habe|nichts|gewusst.","","Ela afirma que não sabia de nada."],
   ["Er|meint,|man|könne|das Problem|schnell|lösen.","","Ele acha que se poderia resolver o problema rápido."]],
q:[["Der Politiker sagte, er ___ krank.",["sei","ist","wäre","sein"],"Der Politiker sagte, er sei krank.","O político disse que estava doente.","Konjunktiv I de sein, 3ª pessoa: sei."],
   ["Laut Zeitung ___ die Firma 200 Mitarbeiter entlassen.",["habe","hat","hätte","haben"],"Laut Zeitung habe die Firma 200 Mitarbeiter entlassen.","Segundo o jornal, a empresa teria demitido 200 funcionários.","Konjunktiv I de haben: habe."],
   ["Sie erklärte, sie ___ morgen nicht kommen.",["könne","kann","konnte","könnten"],"Sie erklärte, sie könne morgen nicht kommen.","Ela explicou que não poderia vir amanhã.","Konjunktiv I de können: könne."]]},

{id:"de-indirekte-rede",u:"de-10",t:"Discurso indireto na prática",m:"ele disse que…",f:"Konj. I quando difere do indicativo; senão Konj. II (sie hätten, sie würden) · passado: habe/sei + Partizip II",
e:"Transforme pronomes e tempo: „Ich bin müde“ → Er sagt, er sei müde. „Wir haben keine Zeit“ → Sie sagen, sie hätten keine Zeit (haben = indicativo, então hätten).",
c:"Na fala do dia a dia muita gente usa indicativo ou würde; em textos formais, o Konjunktiv I.",
x:[["Er sagt,|er|habe|den Zug|verpasst.","","Ele diz que perdeu o trem."],
   ["Die Kunden|meinen,|sie|hätten|keine Informationen|bekommen.","","Os clientes dizem que não receberam informações."],
   ["Sie|fragte,|ob|ich|morgen|Zeit|hätte.","","Ela perguntou se eu teria tempo amanhã."]],
q:[["„Wir haben keine Zeit.“ → Sie sagen, sie ___ keine Zeit.",["hätten","haben","habe","hatten"],"Sie sagen, sie hätten keine Zeit.","Eles dizem que não têm tempo.","sie haben (Konj. I = indicativo) → usa Konj. II hätten."],
   ["„Ich bin gestern angekommen.“ → Er sagt, er ___ gestern angekommen.",["sei","ist","wäre","habe"],"Er sagt, er sei gestern angekommen.","Ele diz que chegou ontem.","Passado com sein: sei + Partizip II."],
   ["„Kommst du mit?“ → Sie fragt, ___ ich mitkomme.",["ob","dass","wenn","was"],"Sie fragt, ob ich mitkomme.","Ela pergunta se eu vou junto.","Pergunta sim/não indireta: ob."]]},

{id:"de-konj2-vergangenheit",u:"de-10",t:"Konjunktiv II no passado",m:"teria feito / teria ido",f:"hätte / wäre + Partizip II",
e:"Situação irreal no passado, arrependimento ou crítica: Ich hätte früher anfangen sollen. Wenn ich das gewusst hätte, wäre ich gekommen.",
c:"hätte com verbos de haben, wäre com verbos de sein (gehen, kommen, bleiben).",
x:[["Ich|hätte|dir|gern|geholfen.","","Eu teria gostado de te ajudar."],
   ["Ohne dich|wäre|ich|nicht|gekommen.","","Sem você eu não teria vindo."],
   ["Wenn|es|nicht|geregnet|hätte,|wären|wir|gewandert.","","Se não tivesse chovido, teríamos feito trilha."]],
q:[["Wenn ich den Bus nicht verpasst hätte, ___ ich pünktlich gewesen.",["wäre","hätte","würde","war"],"Wenn ich den Bus nicht verpasst hätte, wäre ich pünktlich gewesen.","Se eu não tivesse perdido o ônibus, teria chegado na hora.","sein → wäre … gewesen."],
   ["Das ___ ich nie gedacht!",["hätte","wäre","würde","hatte"],"Das hätte ich nie gedacht!","Eu nunca teria imaginado isso!","denken usa haben → hätte gedacht."],
   ["An deiner Stelle wäre ich zu Hause ___.",["geblieben","bleiben","gebleibt","blieb"],"An deiner Stelle wäre ich zu Hause geblieben.","No seu lugar, eu teria ficado em casa.","wäre + Partizip II (geblieben)."]]},

{id:"de-modal-vergangenheit",u:"de-10",t:"Modal no passado irreal",m:"deveria ter / poderia ter feito",f:"hätte + infinitivo + modal no infinitivo (no fim)",
e:"Crítica ou arrependimento com modal: Du hättest mich anrufen sollen. O modal fica no infinitivo, depois do verbo principal (duplo infinitivo).",
c:"Na subordinada, hätte vem antes dos dois infinitivos: …, dass du mich hättest anrufen sollen.",
x:[["Du|hättest|mich|anrufen|sollen.","","Você deveria ter me ligado."],
   ["Wir|hätten|früher|losfahren|müssen.","","Nós teríamos que ter saído mais cedo."],
   ["Das|hätte|ich|allein|machen|können.","","Isso eu poderia ter feito sozinho."]],
q:[["Ich hätte mehr für die Prüfung lernen ___.",["sollen","gesollt","soll","sollten"],"Ich hätte mehr für die Prüfung lernen sollen.","Eu deveria ter estudado mais para a prova.","Duplo infinitivo: lernen sollen."],
   ["Du ___ mir das sagen können!",["hättest","hattest","würdest","wärst"],"Du hättest mir das sagen können!","Você poderia ter me dito isso!","hätte + infinitivo + modal."],
   ["Wir hätten nicht so viel essen ___.",["dürfen","gedurft","darf","durften"],"Wir hätten nicht so viel essen dürfen.","Não deveríamos ter comido tanto.","Modal no infinitivo no fim."]]},

{id:"de-als-ob",u:"de-10",t:"als ob / als wenn",m:"como se",f:"als ob + … + Konjunktiv II no fim · als + Konjunktiv II direto (formal)",
e:"Comparação irreal: Er tut so, als ob er nichts wüsste. Versão formal: Er tut so, als wüsste er nichts.",
c:"Português usa imperfeito do subjuntivo ('como se soubesse'); alemão usa Konjunktiv II.",
x:[["Er|tut so,|als ob|er|alles|wüsste.","","Ele age como se soubesse tudo."],
   ["Du|siehst aus,|als ob|du|nicht|geschlafen|hättest.","","Você está com cara de quem não dormiu."],
   ["Es|sieht aus,|als|würde|es|gleich|regnen.","","Parece que vai chover já já."]],
q:[["Sie spricht, als ob sie die Chefin ___.",["wäre","ist","war","sei"],"Sie spricht, als ob sie die Chefin wäre.","Ela fala como se fosse a chefe.","als ob + Konjunktiv II: wäre."],
   ["Er tut so, ___ er mich nicht kennen würde.",["als ob","wie ob","als dass","wenn ob"],"Er tut so, als ob er mich nicht kennen würde.","Ele finge que não me conhece.","Comparação irreal: als ob."],
   ["Es sieht so aus, als ___ er krank.",["wäre","ob wäre","ist","sei ob"],"Es sieht so aus, als wäre er krank.","Parece que ele está doente.","Sem ob: als + verbo logo depois."]]},

/* ---------- de-11 ---------- */
{id:"de-indem",u:"de-11",t:"indem",m:"(fazendo) ao; por meio de",f:"…, indem + … + verbo no fim",
e:"Diz o modo ou meio: Man lernt eine Sprache, indem man viel spricht. Responde à pergunta Wie?",
c:"Português usa gerúndio ('falando muito'); alemão precisa de oração com indem.",
x:[["Ich|lerne|Vokabeln,|indem|ich|sie|laut|wiederhole.","","Aprendo vocabulário repetindo em voz alta."],
   ["Man|spart|Energie,|indem|man|das Licht|ausschaltet.","","Economiza-se energia apagando a luz."],
   ["Er|hat|sich|entschuldigt,|indem|er|Blumen|geschickt|hat.","","Ele se desculpou mandando flores."]],
q:[["Sie hat ihr Deutsch verbessert, ___ sie deutsche Serien gesehen hat.",["indem","damit","sodass","obwohl"],"Sie hat ihr Deutsch verbessert, indem sie deutsche Serien gesehen hat.","Ela melhorou o alemão assistindo séries alemãs.","Meio (Wie?): indem."],
   ["Wie kann man Geld sparen? – ___ man weniger Auto fährt.",["Indem","Damit","Um","Weil"],"Indem man weniger Auto fährt.","Dirigindo menos.","Resposta a Wie?: indem."],
   ["Man bleibt gesund, indem man regelmäßig Sport ___.",["macht","machen","macht man","zu machen"],"Man bleibt gesund, indem man regelmäßig Sport macht.","Mantém-se saudável fazendo esporte regularmente.","Verbo no fim."]]},

{id:"de-sodass",u:"de-11",t:"sodass / so …, dass",m:"de modo que; tão… que",f:"…, sodass + … + verbo no fim · so + adjetivo, dass …",
e:"Consequência: Es regnete stark, sodass das Spiel abgesagt wurde. Com intensidade: Er war so müde, dass er sofort einschlief.",
c:"damit = finalidade (para que); sodass = consequência (de modo que).",
x:[["Es|regnete|stark,|sodass|das Spiel|abgesagt|wurde.","","Choveu forte, de modo que o jogo foi cancelado."],
   ["Ich|war|so|müde,|dass|ich|sofort|eingeschlafen|bin.","","Eu estava tão cansado que dormi na hora."],
   ["Der Zug|hatte|Verspätung,|sodass|ich|den Anschluss|verpasste.","","O trem atrasou, de modo que perdi a conexão."]],
q:[["Das Essen war ___ scharf, dass niemand es essen konnte.",["so","sodass","zu","damit"],"Das Essen war so scharf, dass niemand es essen konnte.","A comida estava tão apimentada que ninguém conseguiu comer.","Intensidade: so + adjetivo, dass."],
   ["Er hat verschlafen, ___ er zu spät kam.",["sodass","damit","indem","obwohl"],"Er hat verschlafen, sodass er zu spät kam.","Ele perdeu a hora, de modo que chegou atrasado.","Consequência: sodass."],
   ["Ich erkläre es langsam, ___ alle es verstehen.",["damit","sodass","indem","als ob"],"Ich erkläre es langsam, damit alle es verstehen.","Explico devagar para que todos entendam.","Finalidade (intenção): damit, não sodass."]]},

{id:"de-falls",u:"de-11",t:"falls / sofern / im Fall",m:"caso; desde que",f:"falls/sofern + … + verbo no fim · im Fall(e) + Genitiv",
e:"falls = caso (possibilidade); sofern = desde que (condição limitante, formal). Mais cautelosos que wenn.",
c:"Falls du Hilfe brauchst… (caso precise) soa menos provável que Wenn du Hilfe brauchst…",
x:[["Falls|es|regnet,|bleiben|wir|zu Hause.","","Caso chova, ficamos em casa."],
   ["Sofern|nichts|dazwischenkommt,|sind|wir|um acht|da.","","Desde que nada aconteça, estaremos lá às oito."],
   ["Im Fall|eines Brandes|benutzen Sie|die Treppe.","","Em caso de incêndio, use a escada."]],
q:[["___ du Fragen hast, ruf mich an.",["Falls","Obwohl","Damit","Indem"],"Falls du Fragen hast, ruf mich an.","Caso tenha dúvidas, me ligue.","Condição possível: falls."],
   ["Die Garantie gilt nur, ___ das Gerät richtig benutzt wurde.",["sofern","obwohl","sodass","damit"],"Die Garantie gilt nur, sofern das Gerät richtig benutzt wurde.","A garantia só vale desde que o aparelho tenha sido usado corretamente.","Condição limitante: sofern."],
   ["Im Fall ___ Verspätung informieren wir Sie.",["einer","eine","einem","einen"],"Im Fall einer Verspätung informieren wir Sie.","Em caso de atraso, informaremos o senhor.","im Fall + Genitiv: einer."]]},

{id:"de-ohne-statt-zu",u:"de-11",t:"ohne … zu / statt … zu",m:"sem (fazer) / em vez de (fazer)",f:"ohne/(an)statt + … + zu + infinitivo (mesmo sujeito) · ohne dass / statt dass (sujeitos diferentes)",
e:"Er ging, ohne sich zu verabschieden. Statt zu lernen, spielt er. Com sujeitos diferentes: ohne dass es jemand merkte.",
c:"Português 'sem dizer' vira ohne … zu sagen, com zu antes do verbo no fim.",
x:[["Er|ging|weg,|ohne|sich|zu verabschieden.","","Ele foi embora sem se despedir."],
   ["Statt|zu|lernen,|sieht|sie|fern.","","Em vez de estudar, ela vê TV."],
   ["Sie|verließ|den Raum,|ohne dass|es|jemand|merkte.","","Ela saiu da sala sem que ninguém percebesse."]],
q:[["Er hat unterschrieben, ohne den Vertrag ___.",["zu lesen","lesen","gelesen","zu gelesen"],"Er hat unterschrieben, ohne den Vertrag zu lesen.","Ele assinou sem ler o contrato.","ohne … zu + infinitivo."],
   ["___ mit dem Auto zu fahren, nehmen wir das Fahrrad.",["Statt","Ohne","Um","Damit"],"Statt mit dem Auto zu fahren, nehmen wir das Fahrrad.","Em vez de ir de carro, vamos de bicicleta.","Alternativa: statt … zu."],
   ["Er hat das Geld genommen, ___ ich es wusste.",["ohne dass","ohne zu","statt zu","um"],"Er hat das Geld genommen, ohne dass ich es wusste.","Ele pegou o dinheiro sem que eu soubesse.","Sujeitos diferentes: ohne dass."]]},

{id:"de-zwar-aber",u:"de-11",t:"zwar … aber / nicht nur … sondern auch",m:"é verdade que… mas / não só… mas também",f:"zwar (posição 1 ou no meio) …, aber … · nicht nur …, sondern auch …",
e:"zwar reconhece algo e aber contrasta: Das Hotel ist zwar teuer, aber sehr schön. nicht nur … sondern auch soma com ênfase.",
c:"sondern corrige depois de negação; aber só contrasta.",
x:[["Die Wohnung|ist|zwar|klein,|aber|sehr|gemütlich.","","O apartamento é pequeno, é verdade, mas muito aconchegante."],
   ["Sie|spricht|nicht nur|Deutsch,|sondern auch|Japanisch.","","Ela fala não só alemão, mas também japonês."],
   ["Zwar|habe|ich|wenig Zeit,|aber|ich|helfe|dir.","","Tenho pouco tempo, é verdade, mas te ajudo."]],
q:[["Der Kurs ist zwar anstrengend, ___ sehr nützlich.",["aber","sondern","oder","denn"],"Der Kurs ist zwar anstrengend, aber sehr nützlich.","O curso é cansativo, é verdade, mas muito útil.","zwar … aber."],
   ["Er ist nicht nur Arzt, ___ auch Musiker.",["sondern","aber","oder","und"],"Er ist nicht nur Arzt, sondern auch Musiker.","Ele não só é médico, mas também músico.","nicht nur … sondern auch."],
   ["Das ist nicht mein Handy, ___ deins.",["sondern","aber","doch","zwar"],"Das ist nicht mein Handy, sondern deins.","Este não é o meu celular, e sim o seu.","Correção após negação: sondern."]]},

/* ---------- de-12 ---------- */
{id:"de-partizip1",u:"de-12",t:"Partizip I como adjetivo",m:"que (está) fazendo: o bebê que chora",f:"infinitivo + d + terminação de adjetivo (weinend → das weinende Kind)",
e:"Ação simultânea, ativa: das schlafende Kind (a criança que dorme), die steigenden Preise (os preços em alta).",
c:"Partizip I = ativo e em andamento; Partizip II = passivo ou concluído.",
x:[["Das|weinende Kind|sucht|seine Mutter.","","A criança que chora procura a mãe."],
   ["Die|steigenden Preise|sind|ein Problem.","","A alta dos preços é um problema."],
   ["Er|sprach|mit|lächelndem Gesicht.","","Ele falou com o rosto sorridente."]],
q:[["Ich habe Angst vor ___ Hunden.",["bellenden","gebellten","bellende","bellend"],"Ich habe Angst vor bellenden Hunden.","Tenho medo de cachorros que latem.","Partizip I + terminação (Dativ plural, sem artigo: -en)."],
   ["Das ___ Wasser war sehr heiß.",["kochende","gekochte","kochendes","kochen"],"Das kochende Wasser war sehr heiß.","A água fervendo estava muito quente.","das + Nom. neutro: -e."],
   ["Wegen der ___ Kosten müssen wir sparen.",["steigenden","gestiegene","steigende","steigend"],"Wegen der steigenden Kosten müssen wir sparen.","Por causa dos custos crescentes, temos que economizar.","Genitiv plural: -en."]]},

{id:"de-partizip2-adj",u:"de-12",t:"Partizip II como adjetivo",m:"(que foi) feito: o carro consertado",f:"Partizip II + terminação de adjetivo (repariert → das reparierte Auto)",
e:"Resultado ou passiva: das reparierte Auto, die gekochten Kartoffeln, ein gut bezahlter Job.",
c:"der geschlossene Laden (fechado) × der schließende Laden (que está fechando).",
x:[["Das|reparierte Auto|fährt|wieder.","","O carro consertado voltou a andar."],
   ["Ich|esse|gern|gekochte Eier.","","Gosto de ovos cozidos."],
   ["Sie|hat|einen|gut bezahlten Job.","","Ela tem um emprego bem pago."]],
q:[["Die ___ Briefe liegen auf dem Tisch.",["geschriebenen","schreibenden","geschrieben","geschriebene"],"Die geschriebenen Briefe liegen auf dem Tisch.","As cartas escritas estão na mesa.","Partizip II + die (plural Nom.) → -en."],
   ["Ich suche eine ___ Wohnung.",["möblierte","möblierende","möbliert","möblierten"],"Ich suche eine möblierte Wohnung.","Procuro um apartamento mobiliado.","eine + Akk. fem.: -e."],
   ["Das ist ein oft ___ Fehler.",["gemachter","machender","gemacht","gemachte"],"Das ist ein oft gemachter Fehler.","É um erro cometido com frequência.","ein + Nom. masc.: -er."]]},

{id:"de-partizipialattribut",u:"de-12",t:"Atributo participial estendido",m:"a carta escrita ontem pelo chefe",f:"artigo + [complementos] + particípio com terminação + substantivo",
e:"Típico de textos formais e notícias: die von der Regierung geplante Reform = a reforma planejada pelo governo. Leia: artigo → pule até o substantivo → volte.",
c:"Pode ser desfeito em oração relativa: die Reform, die von der Regierung geplant wurde.",
x:[["Die|von der Regierung|geplante|Reform|wird|kritisiert.","","A reforma planejada pelo governo está sendo criticada."],
   ["Der|seit Jahren|leer stehende|Bahnhof|wird|renoviert.","","A estação vazia há anos será reformada."],
   ["Das|im Jahr 1900|gebaute|Haus|steht|unter Denkmalschutz.","","A casa construída em 1900 é tombada."]],
q:[["Die ___ Studie zeigt klare Ergebnisse.",["gestern veröffentlichte","gestern veröffentlicht","veröffentlichte gestern","gestern veröffentlichten"],"Die gestern veröffentlichte Studie zeigt klare Ergebnisse.","O estudo publicado ontem mostra resultados claros.","Complemento antes do particípio; die + Nom. fem.: -e."],
   ["Der im Park ___ Hund gehört meinem Nachbarn.",["spielende","spielenden","gespielte","spielend"],"Der im Park spielende Hund gehört meinem Nachbarn.","O cachorro que brinca no parque é do meu vizinho.","der + Nom. masc.: -e."],
   ["Wir diskutieren über den von allen ___ Plan.",["akzeptierten","akzeptierte","akzeptierend","akzeptiert"],"Wir diskutieren über den von allen akzeptierten Plan.","Discutimos o plano aceito por todos.","über den (Akk. masc.): -en."]]},

{id:"de-nominalisierung",u:"de-12",t:"Nominalização",m:"transformar verbo em substantivo (estilo formal)",f:"verbo → substantivo (-ung, infinitivo com artigo das, radical) + Genitiv",
e:"Textos formais preferem substantivos: weil die Preise steigen → wegen des Anstiegs der Preise. nachdem er angekommen war → nach seiner Ankunft.",
c:"Muitos -ung são femininos (die Lösung); infinitivos substantivados são neutros (das Lernen).",
x:[["Nach|seiner Ankunft|rief|er|sofort|an.","","Após sua chegada, ele ligou imediatamente."],
   ["Wegen|des Anstiegs|der Mieten|ziehen|viele|weg.","","Por causa do aumento dos aluguéis, muitos se mudam."],
   ["Beim|Kochen|höre|ich|Musik.","","Ao cozinhar, ouço música."]],
q:[["Nachdem das Konzert beendet war… → Nach ___ des Konzerts…",["dem Ende","das Ende","den Ende","der Ende"],"Nach dem Ende des Konzerts…","Após o fim do show…","nach + Dativ; das Ende → dem Ende."],
   ["Weil es stark regnete… → Wegen des starken ___…",["Regens","Regen","Regnens","Regnung"],"Wegen des starken Regens…","Por causa da chuva forte…","der Regen, Genitiv: des Regens."],
   ["Während man fährt, darf man nicht telefonieren. → Während ___ darf man nicht telefonieren.",["der Fahrt","dem Fahren","die Fahrt","das Fahren"],"Während der Fahrt darf man nicht telefonieren.","Durante a viagem não se pode falar ao telefone.","während + Genitiv: der Fahrt."]]},

{id:"de-n-deklination",u:"de-12",t:"n-Deklination",m:"substantivos masculinos que ganham -(e)n",f:"der Kunde → den/dem/des Kunden · der Student → den Studenten · der Herr → den Herrn",
e:"Alguns masculinos (pessoas e animais em -e, palavras em -ent, -ant, -ist e alguns outros) ganham -(e)n em todos os casos, exceto o Nominativ singular.",

{id:"de-genitiv-praep",u:"de-13",t:"Preposições com Genitiv",m:"aufgrund, innerhalb, außerhalb, infolge, anstatt, statt",f:"preposição + des/der/des/der (+ -s/-es)",

{id:"de-funktionsverb",u:"de-13",t:"Funktionsverbgefüge",m:"expressões fixas substantivo + verbo (estilo formal)",f:"in Frage kommen, zur Verfügung stellen, Kritik üben, in Kraft treten, eine Entscheidung treffen…",

   ["Die Firma|stellt|uns|einen Laptop|zur Verfügung.","","A empresa nos disponibiliza um notebook."],

   ["Dieser Kandidat kommt für die Stelle nicht in ___.",["Frage","Kraft","Betracht nehmen","Ordnung"],"Dieser Kandidat kommt für die Stelle nicht in Frage.","Este candidato não entra em consideração para a vaga.","in Frage kommen = ser opção."],
   ["Bitte nehmen Sie Rücksicht ___ die Nachbarn.",["auf","an","für","zu"],"Bitte nehmen Sie Rücksicht auf die Nachbarn.","Por favor, tenha consideração com os vizinhos.","Rücksicht nehmen auf + Akk."]]},

{id:"de-lassen",u:"de-13",t:"lassen + infinitivo",m:"mandar fazer / deixar fazer",f:"lassen conjugado + infinitivo no fim · Perfekt: hat … machen lassen",

{id:"de-relativ-wer-was",u:"de-13",t:"Relativas com wer, was e wo(r)-",m:"quem / o que / onde",f:"Wer …, (der) … · alles/etwas/nichts/das, was … · wo (lugar) · wor + preposição (worauf, womit)",
e:"was depois de alles, etwas, nichts, das e de superlativos neutros: Das Beste, was ich je gegessen habe. wer = quem (generalização): Wer zu spät kommt, muss warten.",

x:[["Alles,|was|du|sagst,|ist|richtig.","","Tudo o que você diz está certo."],

   ["Das ist|die Stadt,|wo|ich|geboren|bin.","","Essa é a cidade onde nasci."]],

   ["___ Deutsch lernen will, muss viel üben.",["Wer","Was","Der","Welcher"],"Wer Deutsch lernen will, muss viel üben.","Quem quer aprender alemão precisa praticar muito.","Generalização de pessoa: wer."],
   ["Er hat die Prüfung bestanden, ___ alle überrascht hat.",["was","das","der","wer"],"Er hat die Prüfung bestanden, was alle überrascht hat.","Ele passou na prova, o que surpreendeu todos.","Retoma a frase inteira: was."]]},

{id:"de-verb-prap-b2",u:"de-13",t:"Verbos com preposição (B2)",m:"bestehen aus/auf, sich beschäftigen mit, verfügen über…",f:"verbo + preposição fixa + caso",
e:"Na escrita B2 aparecem: bestehen aus (consistir de), bestehen auf (insistir em), verfügen über (dispor de), sich auseinandersetzen mit (lidar com), sich beziehen auf (referir-se a).",

q:[["Ich beziehe mich ___ Ihre E-Mail vom 3. Mai.",["auf","an","über","zu"],"Ich beziehe mich auf Ihre E-Mail vom 3. Mai.","Refiro-me ao seu e-mail de 3 de maio.","sich beziehen auf + Akk."],
   ["Wir müssen uns ___ diesem Problem auseinandersetzen.",["mit","über","an","von"],"Wir müssen uns mit diesem Problem auseinandersetzen.","Precisamos lidar com este problema.","sich auseinandersetzen mit + Dat."],

{id:"de-modal-subjektiv",u:"de-14",t:"Modais subjetivos",m:"dizem que / deve ser / afirma que",f:"sollen (dizem que) · wollen (ele afirma) · müssen (com certeza) · dürfte (provavelmente) · können (talvez)",
e:"Modais também expressam quão certo algo é: Er soll reich sein (dizem que é rico). Sie will das allein geschafft haben (ela afirma ter conseguido sozinha). Das dürfte stimmen (deve estar certo).",
c:"Er muss krank sein = com certeza está doente (dedução), não 'ele tem que estar'.",
x:[["Der neue Chef|soll|sehr streng|sein.","","Dizem que o novo chefe é muito rígido."],
   ["Er|will|den Unfall|nicht|gesehen|haben.","","Ele afirma não ter visto o acidente."],
   ["Das|dürfte|etwa|50 Euro|kosten.","","Isso deve custar uns 50 euros."]],
q:[["Laut Zeitung ___ das Restaurant sehr gut sein.",["soll","will","darf","muss"],"Laut Zeitung soll das Restaurant sehr gut sein.","Segundo o jornal, o restaurante é muito bom.","Informação de terceiros: sollen."],
   ["Er ___ schon zu Hause sein, das Licht ist an.",["muss","soll","will","darf"],"Er muss schon zu Hause sein, das Licht ist an.","Ele com certeza já está em casa, a luz está acesa.","Dedução forte: müssen."],
   ["Sie ___ alles allein gemacht haben – aber das glaube ich nicht.",["will","soll","muss","dürfte"],"Sie will alles allein gemacht haben – aber das glaube ich nicht.","Ela afirma ter feito tudo sozinha, mas não acredito.","Afirmação do próprio sujeito: wollen."]]},

{id:"de-futur2",u:"de-14",t:"Futur II",m:"terá feito / deve ter feito",f:"werden + Partizip II + haben/sein (no fim)",

q:[["Er ist nicht da. Er wird wohl krank geworden ___.",["sein","haben","werden","worden"],"Er wird wohl krank geworden sein.","Ele deve ter ficado doente.","werden usa sein → geworden sein."],
   ["Bis 18 Uhr ___ ich die Arbeit erledigt haben.",["werde","wird","würde","bin"],"Bis 18 Uhr werde ich die Arbeit erledigt haben.","Até as 18h terei terminado o trabalho.","ich werde + Partizip II + haben."],
   ["Sie werden den Film schon ___ haben.",["gesehen","sehen","gesehen sein","sahen"],"Sie werden den Film schon gesehen haben.","Eles já devem ter visto o filme.","Partizip II + haben no fim."]]},

   ["Sie brauchen nur auf den Knopf ___.",["zu drücken","drücken","gedrückt","drücken zu"],"Sie brauchen nur auf den Knopf zu drücken.","Basta apertar o botão.","nur brauchen … zu."],

{id:"de-tekamolo",u:"de-14",t:"Ordem no meio da frase (TeKaMoLo)",m:"tempo, causa, modo, lugar",f:"Temporal – Kausal – Modal – Lokal (tendência)",
e:"Com vários complementos, a ordem natural é: quando – por quê – como – onde. Ich fahre morgen wegen der Arbeit mit dem Zug nach Berlin.",

["言葉を通して、その国の人々の考え方や価値観に触れることができるからだ。","ことばを とおして、その くにの ひとびとの かんがえかたや かちかんに ふれる ことが できる から だ。","Porque, por meio da língua, podemos entrar em contato com o modo de pensar e os valores daquele povo."],
["たとえば、日本語の敬語は、相手との関係を大切にする文化の表れにほかならない。","たとえば、にほんごの けいごは、あいてとの かんけいを たいせつに する ぶんかの あらわれに ほかならない。","Por exemplo, o keigo japonês não é senão o reflexo de uma cultura que valoriza a relação com o outro."],
["だからこそ、完璧でなくても、使い続けることに意味があるのだ。","だからこそ、かんぺきで なくても、つかいつづける ことに いみが ある のだ。","É justamente por isso que, mesmo sem perfeição, continuar usando tem sentido."]],
perguntas:[["Para o autor, aprender uma língua é…","Entrar em contato com o modo de pensar de um povo","Só decorar palavras","Uma perda de tempo","Útil apenas para viajar"],
["Que exemplo o autor usa?","O keigo japonês","A escrita em kanji","A comida japonesa","Os animes"]]},

{id:"r-de-1",lang:"de",lvl:"A2",titulo:"Mein Umzug nach Berlin",
frases:[
["Letzten Monat bin ich nach Berlin umgezogen.","","Mês passado me mudei para Berlim."],
["Die Wohnung ist klein, aber sehr hell und ruhig.","","O apartamento é pequeno, mas muito claro e tranquilo."],
["Am Anfang hatte ich keine Möbel, deshalb habe ich auf einer Matratze geschlafen.","","No começo eu não tinha móveis, por isso dormi num colchão."],
["Meine Nachbarn haben mir sehr geholfen.","","Meus vizinhos me ajudaram muito."],
["Jetzt kenne ich schon ein paar Leute im Haus.","","Agora já conheço algumas pessoas no prédio."],
["Nächste Woche lade ich alle zum Essen ein.","","Semana que vem vou convidar todos para comer."]],
perguntas:[["Como é o apartamento?","Pequeno, claro e tranquilo","Grande e barulhento","Escuro e caro","Sem janelas"],
["Quem ajudou o narrador?","Os vizinhos","O chefe","A família","Uma empresa de mudança"]]},

{id:"r-de-2",lang:"de",lvl:"B1",titulo:"Beim Arzt",
frases:[
["Seit drei Tagen habe ich starke Kopfschmerzen.","","Há três dias estou com uma forte dor de cabeça."],
["Deshalb habe ich heute Morgen einen Termin beim Hausarzt vereinbart.","","Por isso hoje de manhã marquei consulta com o clínico geral."],
["Der Arzt hat mich gründlich untersucht und gefragt, ob ich genug schlafe.","","O médico me examinou com cuidado e perguntou se eu durmo o suficiente."],
["Ehrlich gesagt arbeite ich zu viel und sitze ständig vor dem Bildschirm.","","Para ser sincero, trabalho demais e fico o tempo todo em frente à tela."],
["Er hat mir geraten, regelmäßig Pausen zu machen und mehr Wasser zu trinken.","","Ele me aconselhou a fazer pausas regulares e beber mais água."],
["Falls es nicht besser wird, soll ich nächste Woche wiederkommen.","","Caso não melhore, devo voltar semana que vem."]],
perguntas:[["Qual é a provável causa da dor de cabeça?","Trabalho demais em frente à tela","Uma queda","Comida estragada","Frio"],
["O que o médico recomendou?","Pausas regulares e mais água","Uma cirurgia","Mudar de emprego","Tomar café"]]},

{id:"r-de-3",lang:"de",lvl:"B1",titulo:"Ein Wochenende ohne Handy",
frases:[
["Letztes Wochenende habe ich ein Experiment gemacht: zwei Tage ohne Handy.","","No último fim de semana fiz um experimento: dois dias sem celular."],
["Am Samstagmorgen war ich ziemlich nervös, weil ich ständig nach dem Handy greifen wollte.","","No sábado de manhã eu estava bem nervoso, porque queria pegar o celular o tempo todo."],
["Trotzdem bin ich spazieren gegangen und habe ein Buch gelesen.","","Mesmo assim fui passear e li um livro."],
["Am Sonntag habe ich gemerkt, dass ich viel entspannter war.","","No domingo percebi que estava muito mais relaxado."],
["Je weniger ich an das Handy gedacht habe, desto mehr habe ich die Zeit genossen.","","Quanto menos eu pensava no celular, mais eu aproveitava o tempo."],
["Jetzt möchte ich jeden Sonntag handyfrei machen.","","Agora quero passar todo domingo sem celular."]],
perguntas:[["Como o narrador se sentiu no sábado de manhã?","Nervoso","Muito relaxado","Doente","Entediado com o livro"],
["O que ele quer fazer agora?","Passar todo domingo sem celular","Comprar um celular novo","Nunca mais ler","Trabalhar no fim de semana"]]},

{id:"r-de-4",lang:"de",lvl:"B2",titulo:"Die Vier-Tage-Woche",
frases:[
["In Deutschland wird zurzeit heftig über die Vier-Tage-Woche diskutiert.","","Na Alemanha discute-se intensamente, no momento, a semana de quatro dias."],
["Befürworter argumentieren, dass ausgeruhte Mitarbeiter produktiver seien.","","Os defensores argumentam que funcionários descansados seriam mais produtivos."],
["Kritiker hingegen befürchten, dass sich die Arbeit an vier Tagen nicht bewältigen lasse.","","Os críticos, por outro lado, temem que o trabalho não possa ser dado conta em quatro dias."],
["Erste Studien deuten darauf hin, dass die Zufriedenheit deutlich steigt, ohne dass die Leistung sinkt.","","Os primeiros estudos indicam que a satisfação aumenta claramente sem que o desempenho caia."],
["Allerdings ist das Modell nicht für jede Branche geeignet, etwa im Gesundheitswesen.","","No entanto, o modelo não é adequado a todos os setores, como a saúde."],
["Es bleibt abzuwarten, ob sich die Vier-Tage-Woche langfristig durchsetzen wird.","","Resta esperar para ver se a semana de quatro dias vai se impor a longo prazo."]],
perguntas:[["O que os críticos temem?","Que o trabalho não caiba em quatro dias","Que os salários subam","Que haja mais trânsito","Que as pessoas durmam demais"],
["O que indicam os primeiros estudos?","A satisfação aumenta sem queda do desempenho","O desempenho cai muito","Ninguém gosta do modelo","Os custos triplicam"]]},

{id:"r-de-5",lang:"de",lvl:"B2",titulo:"Leserbrief: Mehr Radwege!",
frases:[
["Sehr geehrte Damen und Herren, ich beziehe mich auf Ihren Artikel vom 12. März über den Verkehr in unserer Stadt.","","Prezados senhores, refiro-me ao seu artigo de 12 de março sobre o trânsito da nossa cidade."],
["Zwar wurden in den letzten Jahren einige Radwege gebaut, aber sie reichen bei Weitem nicht aus.","","É verdade que algumas ciclovias foram construídas nos últimos anos, mas estão longe de ser suficientes."],
["Wer morgens mit dem Fahrrad zur Arbeit fährt, riskiert täglich einen Unfall.","","Quem vai de bicicleta ao trabalho de manhã arrisca um acidente todos os dias."],
["Die Stadt sollte deshalb mehr in sichere Radwege investieren, statt neue Parkhäuser zu bauen.","","A cidade deveria, por isso, investir mais em ciclovias seguras em vez de construir novos estacionamentos."],
["Davon würden nicht nur Radfahrer, sondern auch die Umwelt profitieren.","","Com isso ganhariam não só os ciclistas, mas também o meio ambiente."],
["Mit freundlichen Grüßen, Anna Weber","","Atenciosamente, Anna Weber"]],
perguntas:[["O que a autora pede?","Mais investimento em ciclovias seguras","Mais estacionamentos","Proibir bicicletas","Mais ônibus noturnos"],
["Quem se beneficiaria, segundo ela?","Os ciclistas e o meio ambiente","Só os motoristas","Só as lojas","Ninguém"]]},

{id:"r-de-6",lang:"de",lvl:"A2",titulo:"Im Supermarkt",
frases:[
["Am Samstag gehe ich immer in den Supermarkt.","","No sábado sempre vou ao supermercado."],
["Ich kaufe Brot, Käse, Obst und manchmal ein bisschen Schokolade.","","Compro pão, queijo, fruta e às vezes um pouco de chocolate."],
["Letzte Woche war der Supermarkt sehr voll, weil Montag ein Feiertag war.","","Semana passada o supermercado estava muito cheio porque segunda era feriado."],

["Danach bin ich mit dem Fahrrad nach Hause gefahren.","","Depois voltei para casa de bicicleta."]],
perguntas:[["Por que o supermercado estava cheio?","Porque segunda era feriado","Porque havia promoção","Porque estava chovendo","Porque abriu uma loja nova"],
